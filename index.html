// Extract percentage from messy strings like "24%", "29% (87)", "24", "0.24"
function parseRate(v){
  if(v==null||v==="") return null;
  const s=String(v);
  const m=s.match(/(\d+(?:\.\d+)?)\s*%/);
  if(m) return parseFloat(m[1]);
  const n=parseFloat(s);
  if(isNaN(n)) return null;
  // 0.24 → 24 ; 24 stays 24
  return n<=1?n*100:n;
}

// Returns 'behind' | 'warn' | 'ok' | 'anomaly' | null
function benchStatus(rawValue,country,kind){
  const n=parseRate(rawValue);
  if(n==null) return null;
  const b=EMAIL_BENCHMARKS[country]||EMAIL_BENCHMARKS.Other;
  const min=kind==="click"?b.clickMin:b.openMin;
  const target=kind==="click"?b.clickTarget:b.openTarget;
  const anomaly=kind==="click"?b.clickAnomaly:b.openAnomaly;
  if(anomaly!=null&&n>=anomaly) return "anomaly";
  if(n<min) return "behind";
  if(n<target) return "warn";
  return "ok";
}

function fDate(d){if(!d)return"—";try{return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}catch{return d;}}
function fDateShort(d){if(!d)return"—";try{return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});}catch{return d;}}
function fmtEng(s){const sec=Math.round(Number(s)||0);if(sec<=0)return"0s";if(sec<60)return`${sec}s`;return`${Math.floor(sec/60)}m ${sec%60}s`;}
function fmtWeek(iso){if(!iso)return"";const d=new Date(iso+"T00:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function weeksTo(d){if(!d)return null;const diff=(new Date(d)-new Date())/(7*24*60*60*1000);return Math.max(0,diff);}

// ── Project due-date colour band (green > 14d, yellow 7–14d, red < 7d, deeper red overdue) ──
function dueDateBand(due){
  if(!due) return {tone:"none",label:"—",color:"#8B8680",bg:"#F4F3EE"};
  const d=new Date(due);
  if(isNaN(d)) return {tone:"none",label:"—",color:"#8B8680",bg:"#F4F3EE"};
  const days=Math.floor((d-new Date())/(1000*60*60*24));
  if(days<0) return {tone:"overdue",label:`${Math.abs(days)}d overdue`,color:"#7F1D1D",bg:"#FECACA",days};
  if(days<7) return {tone:"red",label:`${days}d left`,color:"#B42024",bg:"#FEE2E2",days};
  if(days<=14) return {tone:"yellow",label:`${days}d left`,color:"#A16207",bg:"#FEF3C7",days};
  return {tone:"green",label:`${days}d left`,color:"#15803D",bg:"#DCFCE7",days};
}

// ── Effective task status — auto-flips to "Overdue" when due date has passed
//    and the task isn't already Done / Cancelled / Overdue.
function effectiveTaskStatus(task){
  const raw=task?.status||"Pending";
  if(raw==="Done"||raw==="Cancelled"||raw==="Overdue") return raw;
  const due=task?.dueDate||task?.date;
  if(!due) return raw;
  const d=new Date(due);
  if(isNaN(d)) return raw;
  return d<new Date()?"Overdue":raw;
}

// Walk every task in a session (EE Timeline, Marketing, Run of Show) and return
// the ones currently Overdue without a justification comment yet.
function findOverdueNeedingJustification(s){
  const out=[];
  (s.eeTimeline||[]).forEach(t=>{
    if(effectiveTaskStatus(t)==="Overdue"&&!t.overdueComment){
      out.push({source:"EE Timeline",name:t.task||"(untitled)",owner:t.owner||s.team?.ee||"—",dueDate:t.dueDate||t.date,id:t.id});
    }
  });
  Object.entries(s.marketing?.tasks||{}).forEach(([k,v])=>{
    if(effectiveTaskStatus(v)==="Overdue"&&!v.overdueComment){
      out.push({source:"Marketing",name:k,owner:v.owner||s.marketing?.taskOwner||s.team?.mkt||"—",dueDate:v.dueDate,id:k});
    }
  });
  (s.runOfShow||[]).forEach(t=>{
    if(effectiveTaskStatus(t)==="Overdue"&&!t.overdueComment){
      out.push({source:"Run of Show",name:t.task||t.name||"(untitled)",owner:t.owner||"—",dueDate:t.dueDate||t.date,id:t.id});
    }
  });
  return out;
}
function dlBlob(content,filename,type="text/html"){const b=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);}

// ────────────────────────────────────────────────────────────────────────────────
// PER-SESSION GOOGLE SHEET HELPER
// Each networking session has ONE Apps Script URL stored in its config.
// All reads/writes for that session route through that URL.
// ────────────────────────────────────────────────────────────────────────────────
async function sheetPush(scriptUrl,action,payload){
  if(!scriptUrl||scriptUrl.includes("YOUR_")) return {ok:false,reason:"not-configured"};
  try{
    await fetch(scriptUrl,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action,payload,ts:new Date().toISOString()})
    });
    return {ok:true};
  }catch(e){
    return {ok:false,reason:"fetch-failed",error:String(e)};
  }
}
async function sheetPull(scriptUrl,query){
  if(!scriptUrl||scriptUrl.includes("YOUR_")) return {ok:false,reason:"not-configured"};
  try{
    const u=new URL(scriptUrl);
    Object.entries(query||{}).forEach(([k,v])=>u.searchParams.set(k,v));
    const r=await fetch(u.toString(),{method:"GET"});
    if(!r.ok) return {ok:false,reason:"http-"+r.status};
    const data=await r.json();
    return {ok:true,data};
  }catch(e){
    return {ok:false,reason:"fetch-failed",error:String(e)};
  }
}

// ── DocSlot — document upload slot (file or URL) ─────────────────────────────
function fmtBytes(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB";}
function DocSlot({label,doc,onChange,required,accept="application/pdf",hint}){
  const fileRef=useRef(null);
  function handleFile(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    const meta={name:f.name,size:f.size,type:f.type,uploadedAt:new Date().toISOString()};
    // Store base64 only for small files (<500 KB). Bigger files: metadata only,
    // user is expected to keep the original on Drive and link via URL field.
    if(f.size<=500*1024){
      const reader=new FileReader();
      reader.onload=()=>onChange({...meta,base64:reader.result,url:doc?.url||""});
      reader.readAsDataURL(f);
    }else{
      onChange({...meta,url:doc?.url||""});
    }
    if(fileRef.current) fileRef.current.value="";
  }
  function setUrl(v){onChange(doc?{...doc,url:v}:{name:"",size:0,type:"link",url:v,uploadedAt:new Date().toISOString()});}
  function clear(){onChange(null);if(fileRef.current) fileRef.current.value="";}
  const haveFile=!!(doc&&doc.name&&doc.type!=="link");
  const haveUrl=!!(doc&&doc.url);
  const ok=haveFile||haveUrl;

  return <div className="border border-[#E8E5DC] rounded-xl p-3 bg-white">
    <div className="flex items-center justify-between mb-2">
      <div>
        <p className="text-xs font-bold text-[#1F1B1B]">{label}{required&&<span className="text-[#B42024] ml-1">*</span>}</p>
        {hint&&<p className="text-[10px] text-[#8B8680] mt-0.5">{hint}</p>}
      </div>
      {ok?<Pill tone="red">✓ Attached</Pill>:<Pill tone="mute">Missing</Pill>}
    </div>
    <div className="flex gap-2 items-center">
      <button type="button" onClick={()=>fileRef.current&&fileRef.current.click()} className="px-3 py-1.5 btn-secondary rounded-lg text-xs font-bold whitespace-nowrap">Choose file</button>
      <input ref={fileRef} type="file" accept={accept} onChange={handleFile} style={{display:"none"}}/>
      <input value={(doc&&doc.url)||""} onChange={e=>setUrl(e.target.value)} placeholder="…or paste a Drive / link URL" className="flex-1 bg-[#FAFAF7] border border-[#E8E5DC] rounded-lg px-2.5 py-1.5 text-xs mono text-[#3C3838] focus:outline-none focus:border-[#B42024]"/>
      {ok&&<button type="button" onClick={clear} className="text-[#B42024] hover:bg-[#B42024]/10 rounded px-2 py-1 text-xs font-bold">×</button>}
    </div>
    {haveFile&&<p className="text-[10px] text-[#8B8680] mt-1.5"><span className="mono text-[#3C3838]">{doc.name}</span>{doc.size?" · "+fmtBytes(doc.size):""}{doc.size>500*1024?" · metadata only — link the file via the URL field":""}</p>}
  </div>;
}

// ────────────────────────────────────────────────────────────────────────────────
// METRIC AGGREGATORS — power the consolidated dashboard
// ────────────────────────────────────────────────────────────────────────────────
function sessionTaskCounts(s){
  const eeTasks=s.eeTimeline||[];
  const mktTasks=Object.values(s.marketing?.tasks||{});
  const all=[...eeTasks.map(t=>t.status||"Pending"),...mktTasks.map(t=>t.status||"Pending")];
  const c={Pending:0,Active:0,Paused:0,Validation:0,Done:0};
  all.forEach(st=>{c[st]=(c[st]||0)+1;});
  return {...c,total:all.length,pending:c.Pending+c.Active+c.Paused+c.Validation,completed:c.Done};
}

function sessionRegistrations(s){
  const target=parseInt(s.targets?.total||s.objectives?.ee?.regTarget||0)||0;
  const confirmed=(s.contacts||[]).filter(c=>c.status==="Confirmed").length;
  const lastReg=s.regActual&&s.regActual.length?s.regActual[s.regActual.length-1].count:confirmed;
  // Use the larger of confirmed contacts vs latest weekly count (whichever is more truthful)
  const current=Math.max(confirmed,lastReg||0);
  return {target,current,pct:target?Math.min(100,Math.round(current/target*100)):0};
}

// ICP/BP reached vs pipeline vs contract.
// Reached  = unique companies (ICP) or unique titles (BP) among Confirmed contacts
//            with the matching flag set
// Pipeline = same, but contacts still in play (not Confirmed, not Drop Off)
// Contract = s.contractTargets.icp / .bp when present (populated from doc upload);
//            null otherwise → UI shows "—"
function sessionICPBPProgress(s){
  const contacts=s.contacts||[];
  const isPipeline=(c)=>c.status && c.status!=="Confirmed" && c.status!=="Drop Off";

  const icpReached=new Set();
  const icpPipeline=new Set();
  const bpReached=new Set();
  const bpPipeline=new Set();

  contacts.forEach(c=>{
    const company=(c.company||"").trim();
    const title=(c.title||"").trim();
    if(c.icpMatch && company){
      if(c.status==="Confirmed") icpReached.add(company);
      else if(isPipeline(c)) icpPipeline.add(company);
    }
    if(c.bpMatch && title){
      if(c.status==="Confirmed") bpReached.add(title);
      else if(isPipeline(c)) bpPipeline.add(title);
    }
  });

  const ct=s.contractTargets||{};
  return {
    icp:{
      reached:icpReached.size,
      pipeline:icpPipeline.size,
      contract:Number.isFinite(ct.icp)?ct.icp:(ct.icp!=null?parseInt(ct.icp)||null:null)
    },
    bp:{
      reached:bpReached.size,
      pipeline:bpPipeline.size,
      contract:Number.isFinite(ct.bp)?ct.bp:(ct.bp!=null?parseInt(ct.bp)||null:null)
    },
    pipelineOpps:{
      // Pipeline opportunities (e.g. revenue-generating leads) — separate contract
      // figure from the doc upload. Counts contacts still in play.
      count:contacts.filter(isPipeline).length,
      contract:Number.isFinite(ct.pipeline)?ct.pipeline:(ct.pipeline!=null?parseInt(ct.pipeline)||null:null)
    }
  };
}

function aggregateDashboard(sessions){
  const m={
    total:sessions.length,
    active:0,paused:0,done:0,upcoming:0,past:0,
    tasks:{Pending:0,Active:0,Paused:0,Validation:0,Done:0,total:0,pending:0,completed:0},
    regs:{target:0,current:0},
    revenue:{target:0,potential:0},
    icps:new Set(),
    bps:new Set(),
    topics:new Set(),
    audience:0,
    catCounts:{A:0,B:0,C:0,D:0,New:0}
  };
  const today=new Date();
  sessions.forEach(s=>{
    if(s.status==="Active") m.active++;
    else if(s.status==="Paused") m.paused++;
    else if(s.status==="Done") m.done++;
    if(s.date){
      const d=new Date(s.date);
      if(d>=today) m.upcoming++; else m.past++;
    }
    const tc=sessionTaskCounts(s);
    ["Pending","Active","Paused","Validation","Done"].forEach(k=>m.tasks[k]+=tc[k]||0);
    m.tasks.total+=tc.total;m.tasks.pending+=tc.pending;m.tasks.completed+=tc.completed;
    const r=sessionRegistrations(s);
    m.regs.target+=r.target;m.regs.current+=r.current;
    const rev=parseInt(s.objectives?.sales?.revenueTarget||0)||0;
    m.revenue.target+=rev;
    if(s.status!=="Done") m.revenue.potential+=rev;
    (s.icps||[]).forEach(x=>m.icps.add(x));
    (s.bps||[]).forEach(x=>m.bps.add(x));
    (s.topics||[]).forEach(x=>m.topics.add(x));
    m.audience+=parseInt(s.expectedAudience||0)||0;
    (s.contacts||[]).forEach(c=>{if(m.catCounts[c.cat]!=null) m.catCounts[c.cat]++;});
  });
  m.icps=Array.from(m.icps);
  m.bps=Array.from(m.bps);
  m.topics=Array.from(m.topics);
  m.regs.pct=m.regs.target?Math.min(100,Math.round(m.regs.current/m.regs.target*100)):0;
  return m;
}

function fmtMoney(n){const v=Number(n)||0;if(v>=1000000) return"$"+(v/1000000).toFixed(1)+"M";if(v>=1000) return"$"+Math.round(v/1000)+"k";return"$"+v;}

// Flat pending-tasks list across all sessions. Reads optional `owner`, `ownerRole`,
// `createdAt` per task — falls back to session-level role owners when absent (e.g.
// EE tasks → s.team.ee, Marketing tasks → s.marketing.taskOwner). Age is derived
// from createdAt when present; otherwise "—". Sorted oldest-pending first.
function collectPendingTasks(sessions){
  const out=[];
  const today=new Date();
  const ageDays=(iso)=>{
    if(!iso) return null;
    const d=new Date(iso);
    if(isNaN(d)) return null;
    return Math.max(0,Math.floor((today-d)/(1000*60*60*24)));
  };
  sessions.forEach(s=>{
    // EE Timeline tasks
    (s.eeTimeline||[]).forEach(t=>{
      if((t.status||"Pending")==="Done") return;
      out.push({
        name:t.task||"(untitled)",
        status:t.status||"Pending",
        source:"EE",
        owner:t.owner||s.team?.ee||"—",
        ownerRole:t.ownerRole||"EE",
        dueDate:t.date||null,
        createdAt:t.createdAt||null,
        age:ageDays(t.createdAt),
        sessionId:s.id,
        sessionTheme:s.theme,
        sessionCountry:s.country
      });
    });
    // Marketing tasks (object keyed by task name)
    Object.entries(s.marketing?.tasks||{}).forEach(([k,v])=>{
      if((v.status||"Pending")==="Done") return;
      out.push({
        name:k,
        status:v.status||"Pending",
        source:"Marketing",
        owner:v.owner||s.marketing?.taskOwner||s.team?.mkt||"—",
        ownerRole:v.ownerRole||"Marketing",
        dueDate:v.dueDate||null,
        createdAt:v.createdAt||null,
        age:ageDays(v.createdAt),
        sessionId:s.id,
        sessionTheme:s.theme,
        sessionCountry:s.country,
        notes:v.notes||""
      });
    });
  });
  // Oldest first; tasks with no age sink to bottom but ordered by status priority
  const statusRank={Active:0,Paused:1,Validation:2,Pending:3};
  out.sort((a,b)=>{
    if(a.age!=null && b.age!=null) return b.age-a.age;
    if(a.age!=null) return -1;
    if(b.age!=null) return 1;
    return (statusRank[a.status]??9)-(statusRank[b.status]??9);
  });
  return out;
}

// MATH CHECKER — live sanity check on intake numbers
// ────────────────────────────────────────────────────────────────────────────────
function MathChecker({audience,icps,bps,regTarget,lpViews,lpCvr,senPct,senLevels}){
  const aud=parseInt(audience)||0,ni=icps.length,nb=bps.length;
  const pipN=ni&&aud?aud/ni:0;
  const msgs=[];
  if(aud&&ni&&nb){
    if(pipN<nb) msgs.push({t:"warn",m:`${nb} personas but ~${pipN.toFixed(1)} attendees/ICP. Not every persona will be present in every ICP.`});
    else if(pipN<nb*2) msgs.push({t:"warn",m:`~${pipN.toFixed(1)} attendees/ICP with ${nb} personas is tight — ~1 person per persona per ICP.`});
    else msgs.push({t:"ok",m:`Good ratio: ${aud} attendees across ${ni} ICP(s) = ~${pipN.toFixed(1)}/segment with ${nb} persona(s).`});
    if(aud<ni*2) msgs.push({t:"warn",m:`${ni} ICP segments with ${aud} attendees — some segments may have just 1 person.`});
  }
  if(senPct&&aud&&senLevels.length){const need=Math.ceil(aud*senPct/100);msgs.push({t:"info",m:`At ${senPct}% seniority → ${need} of ${aud} must be: ${senLevels.join(", ")}.`});}
  const v=parseInt(lpViews),cvr=parseFloat(lpCvr),rt=parseInt(regTarget);
  if(v&&cvr&&rt){const proj=Math.round(v*cvr/100);msgs.push(proj<rt?{t:"warn",m:`LP: ${v} views × ${cvr}% CVR = ~${proj} regs, but target is ${rt}.`}:{t:"ok",m:`LP: ${v} × ${cvr}% = ~${proj} regs — on track for ${rt} target.`});}
  if(!msgs.length) return <p className="text-xs text-[#8B8680]">Add expected audience, ICPs, and BPs to see the math check.</p>;
  const tones={
    ok:"bg-emerald-50 border-emerald-200 text-emerald-800",
    warn:"bg-[#A8A583]/15 border-[#A8A583]/40 text-[#3C3838]",
    info:"bg-[#FAFAF7] border-[#E8E5DC] text-[#3C3838]"
  };
  const icons={ok:"✓",warn:"⚠",info:"ℹ"};
  return <div className="space-y-1.5">
    {msgs.map((mg,i)=><div key={i} className={cx("flex items-start gap-2 border rounded-lg px-3 py-2 text-xs",tones[mg.t]||tones.info)}><span className="font-bold mt-0.5">{icons[mg.t]}</span><span>{mg.m}</span></div>)}
  </div>;
}

// NEW PROJECT — single-page intake form (all mandatory)
// Project identifiers + 6 required documents. Auto-name = COUNTRY-YYYYMM-SessionName-Topics-FormatShort-ClientName.
// Hard block: cannot create project unless every identifier is filled and every document is uploaded.
// ────────────────────────────────────────────────────────────────────────────────

function NewProject({onBack,onCreate}){
  const[errors,sErrors]=useState({});
  const[submitting,sSubmitting]=useState(false);

  // ─ Pick-up time/date — auto-stamped at form mount, read-only ─
  const[pickedUpAt]=useState(()=>new Date().toISOString());

  // ─ Project identifiers (all mandatory) ─
  const[clientName,sClientName]=useState("");
  const[country,sCountry]=useState("Malaysia");
  const[eventDate,sEventDate]=useState("");
  const[eventTime,sEventTime]=useState("09:00");
  const[sessionName,sSessionName]=useState("");
  const[topics,sTopics]=useState([]);                 // multi-select array
  const[topicOther,sTopicOther]=useState("");         // text when "Others" picked
  const[fmt,sFmt]=useState("Networking");             // Networking / C&E / Others
  const[fmtOther,sFmtOther]=useState("");             // text when "Others" picked
  const[dueDate,sDueDate]=useState("");               // PM-set project deadline

  // ─ Owners ─
  const[salesOwner,sSalesOwner]=useState("");
  const[eeOwner,sEEOwner]=useState("");

  // ─ Six required documents ─
  const[docQuotation,sDocQuotation]=useState(null);
  const[docIcpList,sDocIcpList]=useState(null);
  const[docBpList,sDocBpList]=useState(null);
  const[docProposal,sDocProposal]=useState(null);
  const[docEmailChain,sDocEmailChain]=useState(null);
  const[docInvoice,sDocInvoice]=useState(null);
  const[docClientSolution,sDocClientSolution]=useState(null); // optional context doc

  function docOk(d){return !!(d&&((d.name&&d.type!=="link")||d.url));}

  // ─ Live auto-name preview ─
  const autoName=useMemo(()=>genProjectName({
    country,eventDate,sessionName,topics,topicOther,format:fmt,formatOther:fmtOther,clientName
  }),[country,eventDate,sessionName,topics,topicOther,fmt,fmtOther,clientName]);

  function toggleTopic(t){
    sTopics(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t]);
  }

  function validate(){
    const e={};
    if(!clientName.trim())   e.clientName="Client name is required.";
    if(!country)             e.country="Country is required.";
    if(!eventDate)           e.eventDate="Event date is required.";
    if(!sessionName.trim())  e.sessionName="Session name is required.";
    if(!topics.length)       e.topics="Pick at least one topic.";
    if(topics.includes("Others")&&!topicOther.trim()) e.topicOther="Specify the other topic.";
    if(!fmt)                 e.fmt="Format is required.";
    if(fmt==="Others"&&!fmtOther.trim()) e.fmtOther="Specify the other format.";
    if(!dueDate)             e.dueDate="Project due date is required (set by PM).";
    if(!salesOwner.trim())   e.salesOwner="Sales owner is required.";
    if(!eeOwner.trim())      e.eeOwner="EE owner is required.";
    if(!docOk(docQuotation)) e.docQuotation="Signed client quotation is required.";
    if(!docOk(docIcpList))   e.docIcpList="ICP list is required.";
    if(!docOk(docBpList))    e.docBpList="BP list is required.";
    if(!docOk(docProposal))  e.docProposal="Client proposal is required.";
    if(!docOk(docEmailChain))e.docEmailChain="Client email chain is required.";
    if(!docOk(docInvoice))   e.docInvoice="Invoice is required.";
    return e;
  }

  function buildSession(){
    const id=autoName;                            // auto-name is the new ID
    const legacyId=genSessionId();                // keep NS-XXXX for migration / legacy hooks
    return {
      id,
      legacyId,
      pickedUpAt,
      createdAt:new Date().toISOString(),
      status:"Active",
      country,
      date:eventDate,                             // event date (kept name for backwards compat)
      eventDate,                                  // explicit alias
      time:eventTime,
      dueDate,                                    // project due date (PM)
      sessionName:sessionName.trim(),
      theme:autoName,                             // legacy "theme" now mirrors auto-name (display)
      themeIsProvisional:false,
      topics:topics.map(t=>t==="Others"?(topicOther.trim()||"Others"):t),
      topicOther:topicOther.trim(),
      format:fmt,
      formatOther:fmtOther.trim(),
      // Section-level statuses (PM-driven). Marketing keeps per-task status.
      sectionStatus:{timeline:"Active",outreach:"Active",runofshow:"Active"},
      sectionStatusComments:{},                   // {section:{status:"...",comment:"...",by:"...",at:"..."}}
      // Project people roster — seeded from owners; PM adds more via Brief tab.
      people:[
        ...(eeOwner.trim()?[{name:eeOwner.trim(),dept:"EE",role:"EE Owner"}]:[]),
        ...(salesOwner.trim()?[{name:salesOwner.trim(),dept:"Sales",role:"Sales Owner"}]:[])
      ],
      client:{name:clientName.trim(),solution:{doc:docClientSolution,url:"",label:""}},
      location:"",
      host:"Industry Platform",
      expectedAudience:"",
      sessions:[],
      sponsors:[],
      team:{ee:eeOwner.trim(),sales:salesOwner.trim(),mkt:""},
      objectives:{ee:{},sales:{},mkt:{}},
      targets:{catA:0,catB:0,catC:0,catD:0,nettNew:0,total:0,meetings:0},
      icps:[],bps:[],icpNotes:"",bpNotes:"",
      talkingPoints:[],
      contacts:[],
      eeTimeline:[
        {id:genId("t"),task:"Parse intake documents (ICP / BP / contract)",status:"Pending",date:""},
        {id:genId("t"),task:"Generate per-session Sheet from template",status:"Pending",date:""},
        {id:genId("t"),task:"Confirm contract targets (ICP / BP / pipeline)",status:"Pending",date:""}
      ],
      runOfShow:[],
      postSession:{},
      marketing:{
        campaignType:"",edmWaves:0,nurturingWaves:0,landingPages:0,
        taskOwner:"",tasks:{},collabs:[],chat:[]
      },
      assets:{agenda:"",landingPage:"",utms:""},
      notes:"",
      sheetUrl:"",
      regActual:[],
      documents:{
        quotation:docQuotation,
        icpList:docIcpList,
        bpList:docBpList,
        proposal:docProposal,
        emailChain:docEmailChain,
        invoice:docInvoice
      }
    };
  }

  async function handleSubmit(){
    const e=validate();
    sErrors(e);
    if(Object.keys(e).length>0){
      // Scroll to the first error
      setTimeout(()=>{
        const el=document.querySelector("[data-err='1']");
        if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
      },50);
      return;
    }
    sSubmitting(true);
    const session=buildSession();
    sSubmitting(false);
    onCreate(session);
  }

  const allDocsOk=docOk(docQuotation)&&docOk(docIcpList)&&docOk(docBpList)&&docOk(docProposal)&&docOk(docEmailChain)&&docOk(docInvoice);
  const allIdsOk=clientName.trim()&&country&&eventDate&&sessionName.trim()&&topics.length&&fmt&&dueDate&&salesOwner.trim()&&eeOwner.trim()&&!(topics.includes("Others")&&!topicOther.trim())&&!(fmt==="Others"&&!fmtOther.trim());
  const canSubmit=allDocsOk&&allIdsOk;

  return <div className="min-h-screen bg-white">
    {submitting&&<div className="fixed inset-0 z-50 bg-black/40 flex flex-col items-center justify-center gap-4">
      <div className="w-10 h-10 border-2 border-[#E8E5DC] border-t-[#B42024] rounded-full animate-spin"/>
      <p className="text-sm text-white tracking-wider uppercase font-semibold">Creating project…</p>
    </div>}

    <header className="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-[#E8E5DC]">
      <div className="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-[#8B8680] hover:text-[#B42024] transition-colors text-sm font-semibold">← Dashboard</button>
          <span className="text-[#E8E5DC]">|</span>
          <Brand size="md" sub="New Networking Project"/>
        </div>
      </div>
    </header>

    <main className="max-w-3xl mx-auto px-6 py-8 space-y-5">
      <div>
        <p className="eyebrow text-sm">NEW PROJECT</p>
        <h1 className="text-3xl font-bold serif text-[#1F1B1B] mt-1">Project identifiers.</h1>
        <p className="text-[#8B8680] mt-2 max-w-2xl text-sm">All identifiers and documents below are required. The project name auto-generates from these inputs.</p>
      </div>

      {/* ── Project identifiers (mandatory) ─────────────────────────────── */}
      <Card className="p-5 space-y-4">
        <ST title="Project identifiers" subtitle="All fields required — these drive the auto-generated project name"/>

        <div className="grid md:grid-cols-2 gap-3">
          <div data-err={errors.clientName?"1":undefined}>
            <Inp label="Client name" value={clientName} onChange={sClientName} required error={errors.clientName} placeholder="Concentric AI"/>
          </div>
          <div data-err={errors.country?"1":undefined}>
            <Sel label="Country" value={country} onChange={sCountry} required error={errors.country}>
              {COUNTRIES.map(c=><option key={c} value={c}>{COUNTRY_FLAGS[c]} {c}</option>)}
            </Sel>
          </div>

          <div className="space-y-1">
            <label className="text-xs font-bold uppercase tracking-wider text-[#3C3838]">Pick-up time & date</label>
            <div className="w-full bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl px-3.5 py-2.5 text-sm text-[#3C3838] mono">{new Date(pickedUpAt).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>

          </div>
          <div data-err={errors.dueDate?"1":undefined}>
            <Inp label="Project due date (PM)" type="date" value={dueDate} onChange={sDueDate} required error={errors.dueDate} hint="Internal deadline by which everything must be ready."/>

          <div data-err={errors.eventDate?"1":undefined}>

// ── REGISTRATION MILESTONE TRACKER + CONTINGENCY ─────────────────────────────
function RegMilestoneTracker({s}){
  const milestones=s.regMilestones||{total:0,perSession:0,weekly:{}};
  const actual=s.regActual||[];
  const weeks=["-7w","-6w","-5w","-4w","-3w","-2w","-1w","-6d","-5d","-4d","-3d","-2d","0"];
  const latestActual=actual.length?actual[actual.length-1]:null;
  const latestMilestone=latestActual?milestones.weekly[latestActual.week]:null;
  const pct=latestActual&&latestMilestone?(latestActual.count/latestMilestone*100):null;
  let contingency=null;
  if(pct!==null){
    if(pct<50) contingency={level:"red",msg:"<50% of milestone — Launch FB ads, resend EDM to non-openers, expand database / invite list."};
    else if(pct<80) contingency={level:"amber",msg:"50–80% of milestone — Add touchpoints: reminder EDM or personalised emails."};
    else contingency={level:"green",msg:">80% of milestone — Continue current plan; double down on highest-converting channels."};
  }
  const tones={
    red:"bg-[#B42024]/10 border-[#B42024]/30 text-[#B42024]",
    amber:"bg-[#A8A583]/15 border-[#A8A583]/40 text-[#3C3838]",
    green:"bg-emerald-50 border-emerald-200 text-emerald-800"
  };
  return <Card className="p-5">
    <ST title="Registration milestone tracker" subtitle={`Target: ${milestones.total||0} total · ${milestones.perSession||0} per session`}/>
    {(!milestones.total)&&<div className="mb-3 flex items-start gap-2 bg-[#A8A583]/10 border border-[#A8A583]/30 rounded-xl px-3 py-2.5 text-xs text-[#3C3838]">
      <span className="font-bold text-[#A8A583] mt-0.5">ℹ</span>
      <span><strong>Example data</strong> — milestone targets populate from the per-session Sheet once the contract is uploaded. Set registration targets in the <strong>Config</strong> tab to get started.</span>
    </div>}
    <div className="overflow-x-auto">
      <table className="w-full text-xs min-w-[600px]">
        <thead><tr><td className="py-1.5 pr-3 text-[#8B8680] uppercase tracking-widest font-bold">Week</td>{weeks.map(w=><td key={w} className="py-1.5 px-2 text-center text-[#8B8680] mono font-bold">{w}</td>)}</tr></thead>
        <tbody>
          <tr><td className="py-1.5 pr-3 text-[#3C3838] font-semibold">Target</td>{weeks.map(w=><td key={w} className="py-1.5 px-2 text-center text-[#3C3838] mono">{milestones.weekly?.[w]||"—"}</td>)}</tr>
          <tr><td className="py-1.5 pr-3 text-[#3C3838] font-semibold">Actual</td>{weeks.map(w=>{
            const a=actual.find(x=>x.week===w);
            const t=milestones.weekly?.[w];
            const hit=a&&t&&a.count>=t;
            const close=a&&t&&a.count>=t*0.8;
            return <td key={w} className={cx("py-1.5 px-2 text-center mono font-bold",a?(hit?"text-emerald-600":close?"text-[#A8A583]":"text-[#B42024]"):"text-[#E8E5DC]")}>{a?a.count:"—"}</td>;
          })}</tr>
        </tbody>
      </table>
    </div>
    {contingency&&<div className={cx("mt-4 flex items-start gap-2 p-3 rounded-xl border text-xs",tones[contingency.level])}>
      <span className="font-bold text-base">{contingency.level==="red"?"●":contingency.level==="amber"?"●":"●"}</span>
      <div><p className="font-bold mb-0.5 uppercase tracking-wide">Contingency trigger</p><p>{contingency.msg}</p></div>
    </div>}
  </Card>;
}

// ── ICP × BP quadrant logic (used by Outreach tab) ────────────────────────────
function getIcpBpQuadrant(c){
  if(c.icpMatch&&c.bpMatch) return {label:"ICP + BP",cls:"bg-[#B42024]/10 text-[#B42024] border-[#B42024]/30",action:"Direct invite — expect attendance + bring colleagues"};
  if(c.icpMatch&&!c.bpMatch) return {label:"ICP only",cls:"bg-[#A8A583]/15 text-[#3C3838] border-[#A8A583]/40",action:"Referral ask — get BP names inside this account"};
  if(!c.icpMatch&&c.bpMatch) return {label:"BP only",cls:"bg-amber-50 text-amber-700 border-amber-200",action:"Direct invite if approved — strategic social proof"};
  return {label:"Non-ICP/BP",cls:"bg-stone-100 text-stone-500 border-stone-200",action:"Deprioritise — only touch if strategic referral path exists"};
}

// ── Brief tab ─────────────────────────────────────────────────────────────────
function BriefTab({s,onUpdate}){
  const{role}=useRole();
  const isPm=role==="PM";

  // Auto-derived Brief status: Done only when every task across every other tab is Done.
  const briefStatus=useMemo(()=>{
    const ee=(s.eeTimeline||[]).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled");
    const mkt=Object.values(s.marketing?.tasks||{}).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled");
    const ros=(s.runOfShow||[]).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled");
    const allDone=ee.length===0&&mkt.length===0&&ros.length===0;
    return allDone?"Done":"Active";
  },[s]);

  // Pending counts per tab (for the inline summary row)
  const pending=useMemo(()=>({
    timeline:(s.eeTimeline||[]).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled").length,
    outreach:(s.contacts||[]).filter(c=>!["Confirmed","Drop Off","Declined"].includes(c.status)).length,
    runofshow:(s.runOfShow||[]).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled").length,
    marketing:Object.values(s.marketing?.tasks||{}).filter(t=>(t.status||"Pending")!=="Done"&&(t.status||"Pending")!=="Cancelled").length
  }),[s]);

  const dueBand=dueDateBand(s.dueDate);

  // People roster — fall back to legacy team.* fields if s.people not seeded.
  const people=useMemo(()=>{
    if(s.people&&s.people.length) return s.people;
    const out=[];
    if(s.team?.ee)    out.push({name:s.team.ee,   dept:"EE",       role:"EE Owner"});
    if(s.team?.sales) out.push({name:s.team.sales,dept:"Sales",    role:"Sales Owner"});
    if(s.team?.mkt)   out.push({name:s.team.mkt,  dept:"Marketing",role:"Marketing"});
    return out;
  },[s]);

  const[showAddPerson,sShowAddPerson]=useState(false);
  const[newPerson,sNewPerson]=useState({name:"",dept:"EE",role:""});
  function addPerson(){
    if(!newPerson.name.trim()) return;
    const next=[...people,{...newPerson,name:newPerson.name.trim(),role:newPerson.role.trim()||newPerson.dept}];
    onUpdate&&onUpdate({...s,people:next});
    sNewPerson({name:"",dept:"EE",role:""});
    sShowAddPerson(false);
  }
  function removePerson(idx){
    if(!isPm) return;
    const next=people.filter((_,i)=>i!==idx);
    onUpdate&&onUpdate({...s,people:next});
  }

  return <div className="space-y-5">
    {/* Project meta — auto-derived status + due date band + identifiers */}
    <Card className="p-5">
      <ST title="Project status" subtitle={s.id}/>

        <div>
          <p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mb-0.5">Event date</p>

        </div>
        <div>
          <p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mb-0.5">Country / Location</p>

        <div className="flex flex-wrap gap-2 text-xs">
          {pending.timeline>0&&<span className="px-2 py-1 rounded-lg bg-[#FAFAF7] border border-[#E8E5DC]"><strong>{pending.timeline}</strong> EE Timeline</span>}
          {pending.outreach>0&&<span className="px-2 py-1 rounded-lg bg-[#FAFAF7] border border-[#E8E5DC]"><strong>{pending.outreach}</strong> Outreach</span>}

        <div><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mb-0.5">Topics</p><div className="flex flex-wrap gap-1">{(s.topics||[]).map(t=><Pill key={t} tone="gold">{t}</Pill>)||"—"}</div></div>

    </Card>

    <div className="grid md:grid-cols-3 gap-4">
      <Card className="p-5">
        <ST title="EE objective"/>
        <p className="text-sm text-[#3C3838] whitespace-pre-line">{s.objectives?.ee?.objective||"—"}</p>
        <div className="grid grid-cols-2 gap-3 mt-3 pt-3 border-t border-[#E8E5DC]">
          <div><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Reg target</p><p className="font-bold text-[#1F1B1B]">{s.objectives?.ee?.regTarget||"—"}</p></div>
          <div><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Attend target</p><p className="font-bold text-[#1F1B1B]">{s.objectives?.ee?.attendTarget||"—"}</p></div>
        </div>
        {s.objectives?.ee?.seniorityLevels?.length>0&&<div className="mt-3 pt-3 border-t border-[#E8E5DC]">
          <p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mb-1">Seniority {s.objectives.ee.seniorityPct}%</p>
          <div className="flex flex-wrap gap-1">{s.objectives.ee.seniorityLevels.map(l=><Pill key={l} tone="neutral">{l}</Pill>)}</div>
        </div>}
        {s.objectives?.ee?.metric&&<p className="text-xs text-[#8B8680] mt-3 pt-3 border-t border-[#E8E5DC]">Metric: <strong className="text-[#3C3838]">{s.objectives.ee.metric}</strong></p>}

      <Card className="p-5">
        <ST title="Sales objective"/>
        <p className="text-sm text-[#3C3838] whitespace-pre-line">{s.objectives?.sales?.objective||"—"}</p>
        <div className="mt-3 pt-3 border-t border-[#E8E5DC]">
          <p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Revenue target</p>
          <p className="text-2xl font-bold serif text-[#B42024]">{fmtMoney(s.objectives?.sales?.revenueTarget)}</p>

      <Card className="p-5">
        <ST title="Marketing objective"/>
        <p className="text-sm text-[#3C3838] whitespace-pre-line">{s.objectives?.mkt?.objective||"—"}</p>
        <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-[#E8E5DC] text-xs">
          <div><span className="text-[#8B8680]">LP views:</span> <strong>{s.objectives?.mkt?.lpViews||"—"}</strong></div>
          <div><span className="text-[#8B8680]">LP CVR:</span> <strong>{s.objectives?.mkt?.lpCvr||"—"}%</strong></div>
          <div><span className="text-[#8B8680]">Email OR:</span> <strong>{s.objectives?.mkt?.emailOpenRate||"—"}%</strong></div>
          <div><span className="text-[#8B8680]">LI imp:</span> <strong>{s.objectives?.mkt?.liImpressions||"—"}</strong></div>
          <div className="col-span-2"><span className="text-[#8B8680]">Collaterals:</span> <strong>{s.objectives?.mkt?.collaterals||"—"}</strong></div>
        </div>
      </Card>
    </div>

    <Card className="p-5">
      <ST title="People involved" subtitle="Project roster — by department" action={isPm?<Btn variant="secondary" onClick={()=>sShowAddPerson(v=>!v)}>{showAddPerson?"Cancel":"+ Add person"}</Btn>:null}/>
      {people.length===0?
        <p className="text-xs text-[#8B8680] italic">No people listed yet.{isPm?" Use + Add person to seed the roster.":""}</p>
        :
        <div className="space-y-3">
          {(()=>{
            const grouped={};
            people.forEach((p,i)=>{const d=p.dept||"Other";(grouped[d]=grouped[d]||[]).push({...p,_i:i});});
            const order=["EE","Sales","Marketing","Product","Operations","Other"];
            const keys=Object.keys(grouped).sort((a,b)=>{
              const ai=order.indexOf(a),bi=order.indexOf(b);
              return (ai<0?99:ai)-(bi<0?99:bi);
            });
            return keys.map(d=><div key={d}>
              <p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mb-1.5">{d}</p>
              <div className="flex flex-wrap gap-1.5">
                {grouped[d].map((p)=><span key={p._i} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#FAFAF7] border border-[#E8E5DC] text-xs">
                  <span className="font-semibold text-[#1F1B1B]">{p.name}</span>
                  {p.role&&p.role!==p.dept&&<span className="text-[#8B8680]">· {p.role}</span>}
                  {isPm&&<button onClick={()=>removePerson(p._i)} className="ml-1 text-[#8B8680] hover:text-[#B42024]" title="Remove">×</button>}
                </span>)}
              </div>
            </div>);
          })()}
        </div>
      }

      {showAddPerson&&isPm&&<div className="mt-4 pt-4 border-t border-[#E8E5DC] grid md:grid-cols-4 gap-3 items-end">
        <Inp label="Name" value={newPerson.name} onChange={v=>sNewPerson(p=>({...p,name:v}))} placeholder="Audrey"/>
        <Sel label="Department" value={newPerson.dept} onChange={v=>sNewPerson(p=>({...p,dept:v}))}>
          {["EE","Sales","Marketing","Product","Operations","Other"].map(d=><option key={d}>{d}</option>)}
        </Sel>
        <Inp label="Role (optional)" value={newPerson.role} onChange={v=>sNewPerson(p=>({...p,role:v}))} placeholder="e.g. Designer"/>
        <Btn variant="primary" onClick={addPerson}>Add</Btn>
      </div>}
    </Card>

    <div className="grid md:grid-cols-2 gap-4">
      <Card className="p-5"><ST title="ICPs" subtitle={`${(s.icps||[]).length} accounts`}/>
        {s.icps?.length?<div className="flex flex-wrap gap-1.5">{s.icps.map(i=><NTag key={i} text={i} type="icp"/>)}</div>:<p className="text-xs text-[#8B8680]">None.</p>}
        {s.icpNotes&&<p className="text-xs text-[#8B8680] mt-3 pt-3 border-t border-[#E8E5DC]">{s.icpNotes}</p>}
      </Card>
      <Card className="p-5"><ST title="Buyer personas" subtitle={`${(s.bps||[]).length} personas`}/>
        {s.bps?.length?<div className="flex flex-wrap gap-1.5">{s.bps.map(i=><NTag key={i} text={i} type="bp"/>)}</div>:<p className="text-xs text-[#8B8680]">None.</p>}
        {s.bpNotes&&<p className="text-xs text-[#8B8680] mt-3 pt-3 border-t border-[#E8E5DC]">{s.bpNotes}</p>}
      </Card>
    </div>

    <Card className="p-5"><ST title="Talking points"/>
      {s.talkingPoints?.length?<div className="flex flex-wrap gap-1.5">{s.talkingPoints.map(i=><NTag key={i} text={i} type="tp"/>)}</div>:<p className="text-xs text-[#8B8680]">None.</p>}
    </Card>

    {s.sponsors?.length>0&&<Card className="p-5"><ST title="Sessions & sponsor briefs"/>
      <div className="space-y-2">{s.sponsors.map((sp,i)=><div key={i} className="border border-[#E8E5DC] rounded-xl p-3">
        <div className="flex items-center justify-between mb-1">
          <div className="flex items-center gap-2"><Pill tone="red">{sp.session}</Pill><span className="font-bold text-[#1F1B1B] text-sm">{sp.name}</span></div>
        </div>
        {sp.brief&&<p className="text-xs text-[#3C3838] mt-2 pt-2 border-t border-[#E8E5DC]">{sp.brief}</p>}
      </div>)}</div>
    </Card>}

    <Card className="p-5">
      <ST title="Target breakdown by relationship category" subtitle="Source rows × week-by-week milestone curve · totals + actuals"/>
      <CatTargetTable s={s}/>
    </Card>

    {s.topics?.length>0&&<Card className="p-5"><ST title="Topics"/>
      <div className="flex flex-wrap gap-1.5">{s.topics.map(t=><Pill key={t} tone="gold">{t}</Pill>)}</div>
    </Card>}

    {/* Documents — Irza source-of-truth governance */}
    {(()=>{const d=s.documents||{};const slots=[
      ["Signed quotation",d.quotation,true],
      ["ICP list",d.icpList,true],
      ["BP list",d.bpList,true],
      ["Client proposal",d.proposal,false],
      ["Email chain",d.emailChain,false],
      ["Invoice",d.invoice,false]
    ];const haveAny=slots.some(([,doc])=>doc&&((doc.name&&doc.type!=="link")||doc.url));
    if(!haveAny) return null;
    return <Card className="p-5">
      <ST title="Source documents" subtitle="Originals attached at intake — the verified basis for every number on this project"/>
      <div className="grid md:grid-cols-2 gap-2.5">
        {slots.map(([label,doc,req])=>{
          const ok=doc&&((doc.name&&doc.type!=="link")||doc.url);
          const haveFile=ok&&doc.name&&doc.type!=="link";
          const haveUrl=ok&&doc.url;
          return <div key={label} className={cx("border rounded-xl px-3 py-2.5",ok?"bg-white border-[#E8E5DC]":"bg-[#FAFAF7] border-[#E8E5DC]")}>
            <div className="flex items-center justify-between mb-1">
              <p className="text-xs font-bold text-[#1F1B1B]">{label}{req&&<span className="text-[#B42024] ml-1">*</span>}</p>
              {ok?<Pill tone="red">✓ Attached</Pill>:<Pill tone="mute">Missing</Pill>}
            </div>
            {haveFile&&<p className="text-[10px] text-[#8B8680] mono truncate" title={doc.name}>{doc.name}{doc.size?" · "+fmtBytes(doc.size):""}</p>}
            {haveUrl&&<a href={doc.url} target="_blank" rel="noopener noreferrer" className="text-[10px] text-[#B42024] mono truncate hover:underline block" title={doc.url}>{doc.url}</a>}
          </div>;
        })}
      </div>
    </Card>;})()}

    <Card className="p-5"><ST title="Assets & notes"/>
      <div className="space-y-2 text-sm">
        <div><span className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Agenda:</span> {s.assets?.agenda?<a href={s.assets.agenda} target="_blank" className="text-[#B42024] hover:underline">{s.assets.agenda}</a>:<span className="text-[#8B8680]">—</span>}</div>
        <div><span className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Landing page:</span> {s.assets?.landingPage?<a href={s.assets.landingPage} target="_blank" className="text-[#B42024] hover:underline">{s.assets.landingPage}</a>:<span className="text-[#8B8680]">—</span>}</div>
        <div><span className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">UTMs:</span> <code className="mono text-xs text-[#3C3838]">{s.assets?.utms||"—"}</code></div>
        {s.notes&&<div className="pt-3 border-t border-[#E8E5DC] text-[#3C3838] whitespace-pre-line">{s.notes}</div>}
      </div>
    </Card>
  </div>;
}

// ── EE Timeline tab ───────────────────────────────────────────────────────────
function EETimelineTab({s,upd}){
  const tasks=s.eeTimeline||[];
  const[filter,sFilter]=useState("All");
  const[showAdd,sShowAdd]=useState(false);
  const[newRow,sNewRow]=useState({date:"",owner:"",session:"All",task:"",segments:"",channel:"",sent:"",open:"",clicks:"",responses:"",regs:"",comments:"",status:"Pending"});

  const sessionLabels=["All",...((s.sessions||[]).map((_,i)=>`S${i+1}`))];
  const filtered=filter==="All"?tasks:tasks.filter(r=>r.session===filter||r.session==="All"||!r.session);

  function updTask(i,patch){upd({eeTimeline:tasks.map((t,idx)=>idx===i?{...t,...patch}:t)});}
  function rmTask(i){upd({eeTimeline:tasks.filter((_,idx)=>idx!==i)});}

  function exportCSV(){
    const rows=[["Date","Owner","Session","Task","Segments","Channel","Sent","Open","Clicks","Responses","Regs","Comments","Status"],...tasks.map(r=>[r.date,r.owner,r.session,r.task,r.segments,r.channel,r.sent,r.open,r.clicks,r.responses,r.regs,r.comments,r.status])];
    dlCSV(rows,`EE_Timeline_${s.id}.csv`);
  }

  function logActivity(){
    if(!newRow.date||!newRow.task){alert("Date and task are required.");return;}
    const row={...newRow,id:genId("t")};
    upd({eeTimeline:[...tasks,row]});
    sShowAdd(false);
    sNewRow({date:"",owner:"",session:"All",task:"",segments:"",channel:"",sent:"",open:"",clicks:"",responses:"",regs:"",comments:"",status:"Pending"});
  }

  return <div className="space-y-5 fade">
    {/* Milestone tracker + contingency */}
    <RegMilestoneTracker s={s}/>

    {/* Cat × week framework */}
    <Card className="p-5">
      <ST title="Target breakdown by category" subtitle="Source rows × week-by-week milestone — your registration framework"/>
      <CatTargetTable s={s}/>
    </Card>

    {/* Email benchmarks for this country */}
    {(()=>{const b=EMAIL_BENCHMARKS[s.country]||EMAIL_BENCHMARKS.Other;const covered=!!EMAIL_BENCHMARKS[s.country];return <Card className="p-5">
      <ST title="Email benchmarks" subtitle={`Country: ${s.country||"Other"} — Open & Click cells in the activity log flag against these thresholds`} action={b.calibrated?<Pill tone="red">Calibrated</Pill>:covered?<Pill tone="gold">Calibrated</Pill>:<Pill tone="mute">Fallback (uncovered market)</Pill>}/>
      {b.note&&<p className="text-xs text-[#8B8680] -mt-2 mb-3 italic">{b.note}</p>}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-3">
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Open · min</p><p className="text-2xl font-bold serif text-[#B42024]">{b.openMin}%</p><p className="text-[10px] text-[#8B8680]">below → red</p></div>
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Open · target</p><p className="text-2xl font-bold serif text-emerald-700">{b.openTarget}%</p><p className="text-[10px] text-[#8B8680]">at or above → green</p></div>
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Open · anomaly</p><p className="text-2xl font-bold serif text-violet-700">{b.openAnomaly}%</p><p className="text-[10px] text-[#8B8680]">above → ★ investigate</p></div>
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Click · min</p><p className="text-2xl font-bold serif text-[#B42024]">{b.clickMin}%</p><p className="text-[10px] text-[#8B8680]">below → red</p></div>
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Click · target</p><p className="text-2xl font-bold serif text-emerald-700">{b.clickTarget}%</p><p className="text-[10px] text-[#8B8680]">at or above → green</p></div>
        <div className="bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl p-3"><p className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">Click · anomaly</p><p className="text-2xl font-bold serif text-violet-700">{b.clickAnomaly}%</p><p className="text-[10px] text-[#8B8680]">above → ★ investigate</p></div>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-[#8B8680]">
        <span><span className="text-emerald-700 font-bold">Green</span> = at or above target</span>
        <span><span className="text-[#A8A583] font-bold">Gold</span> = between min and target</span>
        <span><span className="text-[#B42024] font-bold">Red ⚠</span> = below min — investigate downward</span>
        <span><span className="text-violet-700 font-bold">Violet ★</span> = above anomaly threshold — likely tracking issue or unusual sample</span>
      </div>
    </Card>;})()}

    {/* Activity log */}
    <Card className="p-5">
      <ST title="EE activity log" subtitle="Every outreach action logged here" action={<div className="flex gap-2 items-center">
        <div className="flex gap-1.5">{sessionLabels.map(f=><button key={f} onClick={()=>sFilter(f)} className={cx("px-2.5 py-1 rounded-lg text-xs font-semibold border transition-all",filter===f?"bg-[#B42024] text-white border-[#B42024]":"bg-white text-[#3C3838] border-[#E8E5DC] hover:border-[#A8A583]")}>{f}</button>)}</div>
        <Btn variant="secondary" onClick={exportCSV} className="text-xs">⬇ CSV</Btn>
        <Btn variant="primary" onClick={()=>sShowAdd(true)} className="text-xs">+ Log activity</Btn>
      </div>}/>
      {filtered.length===0?<p className="text-sm text-[#8B8680]">No activity yet.</p>:
      <div className="overflow-x-auto">
        <table className="w-full text-xs min-w-[1000px]">
          <thead><tr className="text-[#8B8680] uppercase tracking-widest border-b border-[#E8E5DC]">{["Date","Owner","Session","Task","Segments","Channel","Sent","Open","Clicks","Resp","Regs","Comments",""].map(h=><th key={h} className="text-left py-2 pr-3 font-bold">{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map((r,fi)=>{const i=tasks.findIndex(x=>x.id===r.id);if(i<0) return null;return <tr key={r.id||fi} className="border-b border-[#E8E5DC] hover:bg-[#FAFAF7]">
              <td className="py-2 pr-3 text-[#3C3838] mono whitespace-nowrap"><input type="date" value={r.date||""} onChange={e=>updTask(i,{date:e.target.value})} className="bg-transparent text-xs mono focus:outline-none w-28"/></td>
              <td className="py-2 pr-3"><input value={r.owner||""} onChange={e=>updTask(i,{owner:e.target.value})} placeholder="—" className="w-14 bg-transparent text-xs text-[#B42024] font-bold focus:outline-none"/></td>
              <td className="py-2 pr-3"><select value={r.session||"All"} onChange={e=>updTask(i,{session:e.target.value})} className="bg-[#FAFAF7] text-[10px] rounded px-1.5 py-0.5 border border-[#E8E5DC] focus:outline-none">{sessionLabels.map(x=><option key={x}>{x}</option>)}</select></td>
              <td className="py-2 pr-3 text-[#1F1B1B] max-w-[200px]"><input value={r.task||""} onChange={e=>updTask(i,{task:e.target.value})} className="w-full bg-transparent text-xs focus:outline-none focus:bg-[#FAFAF7] rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3 text-[#8B8680] max-w-[140px]"><input value={r.segments||""} onChange={e=>updTask(i,{segments:e.target.value})} placeholder="—" className="w-full bg-transparent text-xs focus:outline-none focus:bg-[#FAFAF7] rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3 text-[#8B8680]"><select value={r.channel||""} onChange={e=>updTask(i,{channel:e.target.value})} className="bg-transparent text-xs focus:outline-none w-32"><option value="">—</option>{CHANNELS.map(c=><option key={c}>{c}</option>)}</select></td>
              <td className="py-2 pr-3 text-[#3C3838] mono"><input value={r.sent||""} onChange={e=>updTask(i,{sent:e.target.value})} placeholder="—" className="w-14 bg-transparent text-xs mono focus:outline-none"/></td>
              <td className="py-2 pr-3 mono">{(()=>{const st=benchStatus(r.open,s.country,"open");const cls=st?BENCH_TONES[st]:BENCH_TONES.none;const b=EMAIL_BENCHMARKS[s.country]||EMAIL_BENCHMARKS.Other;return <div className="flex items-center gap-1"><input value={r.open||""} onChange={e=>updTask(i,{open:e.target.value})} placeholder="—" className={cx("w-16 bg-transparent text-xs mono font-semibold focus:outline-none",cls)}/>{st==="behind"&&<span className="text-[#B42024] font-bold" title={`Below ${b.openMin}% min for ${s.country||"Other"}`}>⚠</span>}{st==="anomaly"&&<span className="text-violet-700 font-bold" title={`Above ${b.openAnomaly}% — anomaly: investigate tracking or sample size`}>★</span>}</div>;})()}</td>
              <td className="py-2 pr-3 mono">{(()=>{const st=benchStatus(r.clicks,s.country,"click");const cls=st?BENCH_TONES[st]:BENCH_TONES.none;const b=EMAIL_BENCHMARKS[s.country]||EMAIL_BENCHMARKS.Other;return <div className="flex items-center gap-1"><input value={r.clicks||""} onChange={e=>updTask(i,{clicks:e.target.value})} placeholder="—" className={cx("w-16 bg-transparent text-xs mono font-semibold focus:outline-none",cls)}/>{st==="behind"&&<span className="text-[#B42024] font-bold" title={`Below ${b.clickMin}% min for ${s.country||"Other"}`}>⚠</span>}{st==="anomaly"&&<span className="text-violet-700 font-bold" title={`Above ${b.clickAnomaly}% — anomaly: investigate tracking or sample size`}>★</span>}</div>;})()}</td>
              <td className="py-2 pr-3 mono"><input value={r.responses||""} onChange={e=>updTask(i,{responses:e.target.value})} placeholder="—" className="w-12 bg-transparent text-xs mono text-[#A8A583] font-bold focus:outline-none"/></td>
              <td className="py-2 pr-3 mono"><input value={r.regs||""} onChange={e=>updTask(i,{regs:e.target.value})} placeholder="—" className="w-10 bg-transparent text-xs mono text-emerald-700 font-bold focus:outline-none"/></td>
              <td className="py-2 pr-3 text-[#8B8680] max-w-[160px]"><input value={r.comments||""} onChange={e=>updTask(i,{comments:e.target.value})} placeholder="—" className="w-full bg-transparent text-xs focus:outline-none focus:bg-[#FAFAF7] rounded px-1 py-0.5"/></td>
              
              <td className="py-2"><button onClick={()=>rmTask(i)} className="text-[#B42024] hover:bg-[#B42024]/10 rounded px-1.5 py-0.5">×</button></td>
            </tr>;})}
          </tbody>
        </table>
      </div>}
    </Card>

    {/* Log Activity modal */}
    {showAdd&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div className="bg-white border border-[#E8E5DC] rounded-2xl w-full max-w-2xl p-6 fade space-y-4 max-h-[90vh] overflow-auto sh shadow-2xl">
        <div className="flex justify-between items-center sticky top-0 bg-white pb-2"><h3 className="text-base font-bold serif text-[#1F1B1B]">Log activity</h3><button onClick={()=>sShowAdd(false)} className="text-[#8B8680] hover:text-[#B42024] text-xl">×</button></div>
        <div className="grid md:grid-cols-3 gap-3">
          <Inp label="Date" type="date" value={newRow.date} onChange={v=>sNewRow(p=>({...p,date:v}))} required/>
          <Inp label="Owner (initials)" value={newRow.owner} onChange={v=>sNewRow(p=>({...p,owner:v}))} placeholder="RD"/>
          <Sel label="Session" value={newRow.session} onChange={v=>sNewRow(p=>({...p,session:v}))}>{sessionLabels.map(x=><option key={x}>{x}</option>)}</Sel>
        </div>
        <Inp label="Task / action" value={newRow.task} onChange={v=>sNewRow(p=>({...p,task:v}))} placeholder="e.g. Snov first messaging, LinkedIn connect, follow-up letter" required/>
        <div className="grid md:grid-cols-2 gap-3">
          <Inp label="Segments targeted" value={newRow.segments} onChange={v=>sNewRow(p=>({...p,segments:v}))} placeholder="e.g. New - Apollo, Cat C - Zoho"/>
          <Sel label="Channel" value={newRow.channel} onChange={v=>sNewRow(p=>({...p,channel:v}))}><option value="">— Select —</option>{CHANNELS.map(c=><option key={c}>{c}</option>)}</Sel>
        </div>
        <div className="grid md:grid-cols-4 gap-3">
          <Inp label="# Sent" type="number" value={newRow.sent} onChange={v=>sNewRow(p=>({...p,sent:v}))} placeholder="0"/>
          <Inp label="Open rate" value={newRow.open} onChange={v=>sNewRow(p=>({...p,open:v}))} placeholder="e.g. 24%"/>
          <Inp label="Click rate" value={newRow.clicks} onChange={v=>sNewRow(p=>({...p,clicks:v}))} placeholder="e.g. 26%"/>
          <Inp label="Responses" type="number" value={newRow.responses} onChange={v=>sNewRow(p=>({...p,responses:v}))} placeholder="0"/>
        </div>
        <div className="grid md:grid-cols-3 gap-3">
          <Inp label="Registrations" type="number" value={newRow.regs} onChange={v=>sNewRow(p=>({...p,regs:v}))} placeholder="0"/>
        </div>
        <Inp label="Comments" value={newRow.comments} onChange={v=>sNewRow(p=>({...p,comments:v}))} placeholder="Notes on responses, rejections, referrals…"/>
        <div className="flex gap-2 sticky bottom-0 bg-white pt-2">
          <Btn variant="secondary" onClick={()=>sShowAdd(false)} className="flex-1">Cancel</Btn>

        </div>
      </div>
    </div>}
  </div>;
}

// ── Outreach tab ──────────────────────────────────────────────────────────────
function OutreachTab({s,upd}){
  const contacts=s.contacts||[];
  const[search,sSearch]=useState("");
  const[fCat,sFCat]=useState("All");
  const[fStatus,sFStatus]=useState("All");
  const[fSession,sFSession]=useState("All");
  const[showAdd,sShowAdd]=useState(false);
  const[showImport,sShowImport]=useState(false);
  const[importText,sImportText]=useState("");
  const[newC,sNewC]=useState({firstName:"",lastName:"",company:"",title:"",email:"",phone:"",cat:"C",icpMatch:false,bpMatch:false,status:"Not Contacted",channel:"",session:"S1",notes:"",utm:""});
  const sessionLabels=["S1",...((s.sessions||[]).slice(1).map((_,i)=>`S${i+2}`))];
  if(sessionLabels.length===0||!s.sessions?.length) sessionLabels.length=0,sessionLabels.push("S1");

  function updContact(i,patch){
    // Cat D auto-promote to C on Confirmed
    let final=patch;
    if(patch.status==="Confirmed"&&contacts[i]?.cat==="D"){final={...patch,cat:"C",catUpgradedAt:new Date().toISOString()};}
    upd({contacts:contacts.map((c,idx)=>idx===i?{...c,...final}:c)});
  }
  function rmContact(i){if(!confirm("Remove this contact?")) return; upd({contacts:contacts.filter((_,idx)=>idx!==i)});}
  function addContact(){
    if(!newC.firstName&&!newC.email&&!newC.company){alert("Need at least one of: first name, email, or company.");return;}
    upd({contacts:[...contacts,{...newC,id:genId("c")}]});
    sShowAdd(false);
    sNewC({firstName:"",lastName:"",company:"",title:"",email:"",phone:"",cat:"C",icpMatch:false,bpMatch:false,status:"Not Contacted",channel:"",session:"S1",notes:"",utm:""});
  }

  function parseImport(){
    const lines=importText.trim().split("\n").filter(Boolean);
    if(lines.length<2){alert("Need a header row + at least one data row.");return;}
    const sep=lines[0].includes("\t")?"\t":",";
    const header=lines[0].split(sep).map(h=>h.trim().toLowerCase().replace(/^"|"$/g,""));
    const fi=keys=>{for(const k of keys){const i=header.indexOf(k);if(i>=0) return i;} return -1;};
    const iFirst=fi(["first name","firstname","first"]);
    const iLast=fi(["last name","lastname","last"]);
    const iComp=fi(["company","account","account name"]);
    const iTitle=fi(["title","job title","position"]);
    const iEmail=fi(["email","email address"]);
    const iPhone=fi(["phone","phone number","mobile"]);
    const iCat=fi(["cat","category","tier"]);
    const imported=lines.slice(1).map(line=>{
      const cols=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
      return {id:genId("c"),firstName:iFirst>=0?cols[iFirst]||"":"",lastName:iLast>=0?cols[iLast]||"":"",company:iComp>=0?cols[iComp]||"":"",title:iTitle>=0?cols[iTitle]||"":"",email:iEmail>=0?cols[iEmail]||"":"",phone:iPhone>=0?cols[iPhone]||"":"",cat:iCat>=0?(cols[iCat]||"C"):"C",icpMatch:false,bpMatch:false,status:"Not Contacted",channel:"",session:"S1",notes:"",utm:""};
    }).filter(c=>c.firstName||c.company||c.email);
    const existing=new Set(contacts.filter(c=>c.email).map(c=>c.email.toLowerCase()));
    const newOnes=imported.filter(c=>!c.email||!existing.has(c.email.toLowerCase()));
    upd({contacts:[...contacts,...newOnes]});
    sImportText("");sShowImport(false);
    alert(`Imported ${newOnes.length} new contact${newOnes.length!==1?"s":""} (${imported.length-newOnes.length} duplicate${imported.length-newOnes.length!==1?"s":""} skipped).`);
  }

  function exportCSV(){
    const rows=[["First","Last","Company","Title","Email","Phone","Cat","ICP","BP","Status","Channel","Session","UTM","Notes"],...contacts.map(c=>[c.firstName,c.lastName,c.company,c.title,c.email,c.phone,c.cat,c.icpMatch?"Y":"N",c.bpMatch?"Y":"N",c.status,c.channel,c.session,c.utm,c.notes])];
    dlCSV(rows,`Outreach_${s.id}.csv`);
  }

  // Filtering
  const filtered=contacts.map((c,origIdx)=>({...c,_idx:origIdx})).filter(c=>{
    if(search){const q=search.toLowerCase();const blob=`${c.firstName||""} ${c.lastName||""} ${c.company||""} ${c.title||""} ${c.email||""}`.toLowerCase();if(!blob.includes(q))return false;}
    if(fCat!=="All"&&c.cat!==fCat) return false;
    if(fStatus!=="All"&&c.status!==fStatus) return false;
    if(fSession!=="All"&&c.session!==fSession) return false;
    return true;
  });

  // Category counts
  const counts={A:0,B:0,C:0,D:0,New:0};
  const confirmedByCat={A:0,B:0,C:0,D:0,New:0};
  contacts.forEach(c=>{
    if(counts[c.cat]!=null) counts[c.cat]++;
    if(c.status==="Confirmed"&&confirmedByCat[c.cat]!=null) confirmedByCat[c.cat]++;
  });
  const totalConfirmed=contacts.filter(c=>c.status==="Confirmed").length;
  const totalDropped=contacts.filter(c=>c.status==="Declined"||c.status==="Drop Off").length;

  // BP coverage: confirmed BPs vs target persona count
  const targetBpCount=(s.bps||[]).length;
  const confirmedBpAttendees=contacts.filter(c=>c.status==="Confirmed"&&c.bpMatch).length;
  const bpGap=targetBpCount>0&&confirmedBpAttendees<targetBpCount;

  return <div className="space-y-5 fade">
    {/* Stat row by category */}
    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
      {["A","B","C","D","New"].map(cat=>{
        const total=counts[cat],conf=confirmedByCat[cat],pct=total?(conf/total*100):0;
        const bg={A:BRAND.red,B:BRAND.gold,C:"#E0A437",D:BRAND.mute,New:BRAND.redLight}[cat];
        return <Card key={cat} className="p-3">
          <div className="flex items-center justify-between mb-1"><CatBadge cat={cat} small/><span className="text-[10px] text-[#8B8680]">{total} total</span></div>
          <p className="text-2xl font-bold mono text-[#1F1B1B]">{conf}</p>
          <p className="text-[10px] text-[#8B8680]">confirmed</p>
          <div className="prog-bar mt-2"><div className="prog-fill" style={{width:`${pct}%`,background:bg}}/></div>
        </Card>;
      })}
    </div>

    {/* BP coverage alert */}
    {bpGap&&<div className="bg-[#A8A583]/15 border border-[#A8A583]/40 rounded-xl p-4 flex items-start gap-3">
      <span className="text-[#3C3838] text-lg font-bold">⚠</span>
      <div className="text-xs text-[#3C3838]"><p className="font-bold mb-1 uppercase tracking-wide">BP coverage gap</p><p>Only {confirmedBpAttendees} of {targetBpCount} target persona type{targetBpCount!==1?"s":""} have confirmed attendees. Review which roles are missing and escalate outreach.</p></div>
    </div>}

    {/* Controls */}
    <div className="flex flex-wrap gap-3 items-center">
      <input value={search} onChange={e=>sSearch(e.target.value)} placeholder="Search name / company / title…" className="bg-white border border-[#E8E5DC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#B42024] w-56"/>
      <div className="flex gap-1.5 flex-wrap">
        <span className="text-xs text-[#8B8680] self-center">Cat:</span>
        {["All","A","B","C","D","New"].map(f=><button key={f} onClick={()=>sFCat(f)} className={cx("px-2.5 py-1 rounded-lg text-xs font-semibold border",fCat===f?"bg-[#B42024] text-white border-[#B42024]":"bg-white text-[#3C3838] border-[#E8E5DC] hover:border-[#A8A583]")}>{f==="All"?"All":f}</button>)}
      </div>
      <div className="flex gap-1.5 flex-wrap">
        <span className="text-xs text-[#8B8680] self-center">Status:</span>
        {["All","Confirmed","Contacted","Not Contacted","Declined","Drop Off"].map(f=><button key={f} onClick={()=>sFStatus(f)} className={cx("px-2.5 py-1 rounded-lg text-xs font-semibold border",fStatus===f?"bg-[#A8A583] text-white border-[#A8A583]":"bg-white text-[#3C3838] border-[#E8E5DC] hover:border-[#A8A583]")}>{f}</button>)}
      </div>
      <div className="flex gap-2 ml-auto">
        <Btn variant="secondary" onClick={()=>sShowImport(true)} className="text-xs">⬆ Import CSV/TSV</Btn>
        <Btn variant="secondary" onClick={exportCSV} className="text-xs">⬇ Export</Btn>
        <Btn variant="primary" onClick={()=>sShowAdd(true)} className="text-xs">+ Add contact</Btn>
      </div>
    </div>

    <p className="text-xs text-[#8B8680]">{filtered.length} contact{filtered.length!==1?"s":""} shown · {totalConfirmed} confirmed · {totalDropped} dropped</p>

    {/* Contacts table — full EE Portal field set */}
    <Card className="overflow-hidden">
      <div className="overflow-x-auto">
        <table className="w-full text-xs min-w-[1200px]">
          <thead><tr className="border-b border-[#E8E5DC] text-[#8B8680] uppercase tracking-widest">{["Name","Company","Title","Phone","Cat","ICP×BP","Status","Channel","Session","UTM","Notes",""].map(h=><th key={h} className="text-left py-3 pr-3 font-bold">{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map(c=>{const i=c._idx;const q=getIcpBpQuadrant(c);return <tr key={c.id||i} className="border-b border-[#E8E5DC] hover:bg-[#FAFAF7] align-top">
              <td className="py-2 pr-3">
                <input value={c.firstName||""} onChange={e=>updContact(i,{firstName:e.target.value})} placeholder="First" className="w-20 bg-transparent text-xs text-[#1F1B1B] font-semibold focus:outline-none focus:bg-white rounded px-1 py-0.5"/>
                <input value={c.lastName||""} onChange={e=>updContact(i,{lastName:e.target.value})} placeholder="Last" className="w-20 ml-1 bg-transparent text-xs text-[#1F1B1B] font-semibold focus:outline-none focus:bg-white rounded px-1 py-0.5"/>
                {c.email&&<p className="text-[10px] text-[#8B8680] mt-0.5 mono truncate max-w-[180px]" title={c.email}>{c.email}</p>}
              </td>
              <td className="py-2 pr-3"><input value={c.company||""} onChange={e=>updContact(i,{company:e.target.value})} className="w-32 bg-transparent text-xs focus:outline-none focus:bg-white rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3"><input value={c.title||""} onChange={e=>updContact(i,{title:e.target.value})} className="w-40 bg-transparent text-xs focus:outline-none focus:bg-white rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3"><input value={c.phone||""} onChange={e=>updContact(i,{phone:e.target.value})} placeholder="—" className="w-28 bg-transparent text-[10px] mono text-[#3C3838] focus:outline-none focus:bg-white rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3"><select value={c.cat||"New"} onChange={e=>updContact(i,{cat:e.target.value})} className="bg-transparent text-xs font-bold focus:outline-none">{["A","B","C","D","New"].map(k=><option key={k}>{k}</option>)}</select></td>
              <td className="py-2 pr-3">
                <div className="flex flex-col gap-0.5">
                  <span className={cx("text-[10px] font-bold px-1.5 py-0.5 rounded border",q.cls)} title={q.action}>{q.label}</span>
                  <div className="flex gap-2 mt-1">
                    <label className="flex items-center gap-1 text-[10px] text-[#3C3838] cursor-pointer"><input type="checkbox" checked={!!c.icpMatch} onChange={e=>updContact(i,{icpMatch:e.target.checked})} className="accent-[#B42024]"/>ICP</label>
                    <label className="flex items-center gap-1 text-[10px] text-[#3C3838] cursor-pointer"><input type="checkbox" checked={!!c.bpMatch} onChange={e=>updContact(i,{bpMatch:e.target.checked})} className="accent-[#A8A583]"/>BP</label>
                  </div>
                </div>
              </td>
              <td className="py-2 pr-3"><select value={c.status||"Not Contacted"} onChange={e=>updContact(i,{status:e.target.value})} className="bg-transparent text-xs font-semibold focus:outline-none">{STATUSES.map(k=><option key={k}>{k}</option>)}</select></td>
              <td className="py-2 pr-3"><select value={c.channel||""} onChange={e=>updContact(i,{channel:e.target.value})} className="bg-transparent text-xs focus:outline-none w-32"><option value="">—</option>{CHANNELS.map(k=><option key={k}>{k}</option>)}</select></td>
              <td className="py-2 pr-3"><select value={c.session||"S1"} onChange={e=>updContact(i,{session:e.target.value})} className="bg-transparent text-xs focus:outline-none">{sessionLabels.map(x=><option key={x}>{x}</option>)}</select></td>
              <td className="py-2 pr-3"><input value={c.utm||""} onChange={e=>updContact(i,{utm:e.target.value})} placeholder="—" className="w-40 bg-transparent text-[10px] mono text-[#B42024] focus:outline-none focus:bg-white rounded px-1 py-0.5"/></td>
              <td className="py-2 pr-3"><input value={c.notes||""} onChange={e=>updContact(i,{notes:e.target.value})} placeholder="—" className="w-32 bg-transparent text-xs text-[#8B8680] focus:outline-none focus:bg-white rounded px-1 py-0.5"/></td>
              <td className="py-2"><button onClick={()=>rmContact(i)} className="text-[#B42024] hover:bg-[#B42024]/10 rounded px-2 py-0.5">×</button></td>
            </tr>;})}
          </tbody>
        </table>
      </div>
    </Card>

    {/* UTM Builder */}
    <UTMBuilder s={s}/>

    {/* Add contact modal */}
    {showAdd&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div className="bg-white border border-[#E8E5DC] rounded-2xl w-full max-w-2xl p-6 fade space-y-3 max-h-[90vh] overflow-auto sh shadow-2xl">
        <div className="flex justify-between items-center sticky top-0 bg-white pb-2"><h3 className="text-base font-bold serif text-[#1F1B1B]">Add contact</h3><button onClick={()=>sShowAdd(false)} className="text-[#8B8680] hover:text-[#B42024] text-xl">×</button></div>
        <div className="grid md:grid-cols-2 gap-3">
          <Inp label="First name" value={newC.firstName} onChange={v=>sNewC(p=>({...p,firstName:v}))}/>
          <Inp label="Last name" value={newC.lastName} onChange={v=>sNewC(p=>({...p,lastName:v}))}/>
          <Inp label="Company" value={newC.company} onChange={v=>sNewC(p=>({...p,company:v}))}/>
          <Inp label="Title" value={newC.title} onChange={v=>sNewC(p=>({...p,title:v}))}/>
          <Inp label="Email" value={newC.email} onChange={v=>sNewC(p=>({...p,email:v}))}/>
          <Inp label="Phone" value={newC.phone} onChange={v=>sNewC(p=>({...p,phone:v}))}/>
          <Sel label="Category" value={newC.cat} onChange={v=>sNewC(p=>({...p,cat:v}))}>{["A","B","C","D","New"].map(k=><option key={k}>{k}</option>)}</Sel>
          <Sel label="Status" value={newC.status} onChange={v=>sNewC(p=>({...p,status:v}))}>{STATUSES.map(k=><option key={k}>{k}</option>)}</Sel>
          <Sel label="Channel" value={newC.channel} onChange={v=>sNewC(p=>({...p,channel:v}))}><option value="">—</option>{CHANNELS.map(k=><option key={k}>{k}</option>)}</Sel>
          <Sel label="Session" value={newC.session} onChange={v=>sNewC(p=>({...p,session:v}))}>{sessionLabels.map(x=><option key={x}>{x}</option>)}</Sel>
        </div>
        <div className="flex gap-4">
          <label className="flex items-center gap-2 text-xs text-[#3C3838]"><input type="checkbox" checked={newC.icpMatch} onChange={e=>sNewC(p=>({...p,icpMatch:e.target.checked}))} className="accent-[#B42024]"/>ICP match</label>
          <label className="flex items-center gap-2 text-xs text-[#3C3838]"><input type="checkbox" checked={newC.bpMatch} onChange={e=>sNewC(p=>({...p,bpMatch:e.target.checked}))} className="accent-[#A8A583]"/>BP match</label>
        </div>
        <Inp label="UTM" value={newC.utm} onChange={v=>sNewC(p=>({...p,utm:v}))} placeholder="utm_source=…&utm_medium=…&utm_campaign=…"/>
        <TA label="Notes" value={newC.notes} onChange={v=>sNewC(p=>({...p,notes:v}))} rows={2}/>
        <div className="flex gap-2 sticky bottom-0 bg-white pt-2">
          <Btn variant="secondary" onClick={()=>sShowAdd(false)} className="flex-1">Cancel</Btn>
          <Btn variant="primary" onClick={addContact} className="flex-1">Add contact →</Btn>
        </div>
      </div>
    </div>}

    {/* Import modal */}
    {showImport&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div className="bg-white border border-[#E8E5DC] rounded-2xl w-full max-w-2xl p-6 fade space-y-3 shadow-2xl">
        <div className="flex justify-between items-center"><h3 className="text-base font-bold serif text-[#1F1B1B]">Import contacts (CSV / TSV)</h3><button onClick={()=>sShowImport(false)} className="text-[#8B8680] hover:text-[#B42024] text-xl">×</button></div>

// ── MARKETING PORTAL COMPONENTS (extracted) ────────────────────────────────────

function MCard({children,className=""}){return<div className={cx("bg-white border border-[#E8E5DC] rounded-2xl",className)}>{children}</div>;}
function MBtn({children,className="",...p}){return<button {...p} className={cx("px-4 py-2 rounded-xl text-sm font-medium transition-all active:scale-95 disabled:opacity-40",className)}>{children}</button>;}
function MInp({label,value,onChange,placeholder="",type="text",className=""}){
  return<div className={cx("space-y-1",className)}>
    {label&&<p className="text-xs font-medium text-[#8B8680] uppercase tracking-wide">{label}</p>}
    <input type={type} value={value||""} onChange={onChange} placeholder={placeholder} className="w-full bg-white border border-[#E8E5DC] rounded-xl px-3 py-2 text-sm text-[#1F1B1B] placeholder:text-[#8B8680] focus:outline-none focus:border-[#B42024]"/>
  </div>;
}
function MTA({label,value,onChange,placeholder="",rows=4,className=""}){
  return<div className={cx("space-y-1",className)}>
    {label&&<p className="text-xs font-medium text-[#8B8680] uppercase tracking-wide">{label}</p>}
    <textarea rows={rows} value={value||""} onChange={onChange} placeholder={placeholder} className="w-full bg-white border border-[#E8E5DC] rounded-xl px-3 py-2 text-sm text-[#1F1B1B] placeholder:text-[#8B8680] focus:outline-none focus:border-[#B42024] resize-y"/>
  </div>;
}
const MSC={Active:"bg-emerald-500/15 text-emerald-400 border-emerald-500/30",Paused:"bg-amber-500/15 text-amber-400 border-amber-500/30",Validation:"bg-sky-500/15 text-sky-400 border-sky-500/30",Done:"bg-indigo-500/15 text-indigo-400 border-indigo-500/30",Pending:"bg-slate-700/50 text-slate-400 border-slate-600/30"};
function MSBadge({status,small=false}){return<span className={cx("border rounded-lg font-medium",small?"px-2 py-0.5 text-xs":"px-2.5 py-1 text-xs",MSC[status]||MSC.Pending)}>{status||"Pending"}</span>;}
// SC alias used inside extracted components
const SC=MSC;

function ImgUp({label,value,onChange,className=""}){
  const ref=useRef();const[up,sUp]=useState(false);
  async function hf(e){const f=e.target.files[0];if(!f)return;sUp(true);const u=await toB64(f);sUp(false);if(u)onChange({target:{value:u}});}
  return<div className={cx("space-y-1",className)}>
    {label&&<label className="text-xs font-medium text-[#8B8680] uppercase tracking-wide">{label}</label>}
    <div className="flex gap-2">
      <input type="text" value={value||""} onChange={onChange} placeholder="Paste URL or upload" className="flex-1 bg-white border border-[#E8E5DC] rounded-xl px-3 py-2.5 text-sm text-[#1F1B1B] placeholder:text-[#8B8680] focus:outline-none focus:border-[#B42024]"/>
      <input ref={ref} type="file" accept="image/*" onChange={hf}/>
      <button onClick={()=>ref.current.click()} disabled={up} className="px-3 py-2 bg-[#FAFAF7] hover:bg-[#E8E5DC] border border-[#E8E5DC] rounded-xl text-xs text-[#3C3838] whitespace-nowrap">{up?"... ":"Upload"}</button>
    </div>
    {value&&<img src={value} alt="" className="mt-1 rounded-xl w-full max-h-28 object-cover border border-[#E8E5DC]" onError={e=>e.target.style.display="none"}/>}

}

function MStatusModal({taskName,onConfirm,onClose}){
  const[s,sS]=useState("Active");const[r,sR]=useState("");
  const needs=s==="Paused"||s==="Validation";
  return<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">

        {["Active","Paused","Validation","Done"].map(st=>(
          <button key={st} onClick={()=>sS(st)} className={cx("px-3 py-1.5 rounded-xl text-sm border transition-colors",s===st?SC[st]:"bg-[#F4F3EE] border-[#E8E5DC] text-[#8B8680] hover:text-[#1F1B1B]")}>{st}</button>
        ))}

ext}</p></td></tr><tr><td style="background:#b11116;padding:22px 20px;text-align:center"><p style="color:#fff;font-size:17px;font-weight:bold;margin:0">ASEAN Innovation Business Platform</p><p style="color:#f2dede;font-size:13px;line-height:1.6;margin:8px 0 0">Connecting enterprise leaders across ASEAN through insights, dialogue and collaboration</p></td></tr><tr><td style="background:#1e1e1e;padding:14px;text-align:center"><p style="color:#ccc;font-size:12px;margin:0">© AIBP | ASEAN Innovation Business Platform</p></td></tr></table></td></tr></table></body></html>`;}

      </div>
