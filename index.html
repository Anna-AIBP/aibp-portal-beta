// ── IMAGE UPLOAD WITH VALIDATION ─────────────────────────────────────────────
function ImgUpVal({label,value,onChange,disclaimer,maxMB=1,exactDims,speakerMode=false}){
  const[uploading,sUp]=useState(false);const[err,sErr]=useState("");const fRef=useRef();
  async function hf(e){
    const f=e.target.files[0];if(!f)return;sErr("");
    if(f.size>maxMB*1024*1024){sErr(`Image too large (${(f.size/1024/1024).toFixed(1)}MB). Max ${maxMB}MB.`);return;}
    if(exactDims){
      await new Promise(res=>{
        const url=URL.createObjectURL(f);const img=new Image();
        img.onload=()=>{URL.revokeObjectURL(url);
          const valid=exactDims.some(([w,h])=>img.width===w&&img.height===h);
          if(!valid){sErr(`Image must be ${exactDims.map(([w,h])=>w+"×"+h).join(" or ")}px. Got ${img.width}×${img.height}px.`);res(null);}
          else res(true);
        };img.src=url;
      }).then(async ok=>{if(!ok)return;sUp(true);const u=await toB64(f);sUp(false);if(u)onChange({target:{value:u}});});
      return;
    }
    sUp(true);const u=await toB64(f);sUp(false);if(u)onChange({target:{value:u}});
  }
  return<div className="space-y-1.5">
    {label&&<label className="text-xs font-medium text-[#8B8680] uppercase tracking-wide">{label}</label>}
    <p className="text-xs text-amber-400/80">⚠ Max {maxMB}MB{exactDims?` · Must be ${exactDims.map(([w,h])=>w+"×"+h).join(" or ")}px`:""}{speakerMode?" · Will be auto-cropped to circle":""}</p>
    {disclaimer&&<p className="text-xs text-[#8B8680]">{disclaimer}</p>}
    <div className="border border-[#E8E5DC] rounded-xl p-3 space-y-2">
      <MBtn onClick={()=>fRef.current?.click()} className="bg-[#F4F3EE] text-[#3C3838] text-xs w-full">{uploading?"⏳ Uploading…":"📎 Upload Image"}</MBtn>
      <input ref={fRef} type="file" accept="image/*" onChange={hf} style={{display:"none"}}/>
      {err&&<p className="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-lg px-3 py-2">❌ {err}</p>}
      {value&&<div className="relative"><img src={value} className={cx("w-full max-h-32 object-cover",speakerMode?"rounded-full w-16 h-16":"rounded-lg")}/><button onClick={()=>onChange({target:{value:""}})} className="absolute top-1 right-1 bg-rose-500 text-[#1F1B1B] text-xs rounded-full w-5 h-5 flex items-center justify-center">✕</button></div>}
    </div>
  </div>;
}

// ── ANIMATED STATS COMPONENT ──────────────────────────────────────────────────
function AnimatedStat({value,color}){
  const[displayed,setDisplayed]=useState("0");
  const ref=useRef();
  useEffect(()=>{
    const observer=new IntersectionObserver(([entry])=>{
      if(!entry.isIntersecting)return;observer.disconnect();
      const num=parseFloat(value)||0;const suffix=value.replace(/[\d.]/g,"");
      let start=0;const dur=1200;const step=16;
      const inc=num/(dur/step);
      const t=setInterval(()=>{start+=inc;if(start>=num){setDisplayed(num+suffix);clearInterval(t);}else setDisplayed(Math.floor(start)+suffix);},step);
    },{threshold:0.3});
    if(ref.current)observer.observe(ref.current);
    return()=>observer.disconnect();
  },[value]);
  return<span ref={ref} style={{color:color||"#212b5a",fontWeight:"800"}}>{displayed}</span>;
}

    return<div style={{...bgStyle,padding:"48px 24px",fontFamily:"Arial,sans-serif",color:"#fff"}}>
      <div style={{maxWidth:"1000px",margin:"0 auto",display:"grid",gridTemplateColumns:"1fr 1.6fr",gap:"60px",alignItems:"start"}}>
        <div style={{position:"sticky",top:"80px",height:"fit-content"}}>
          {sec.eyebrow&&<span style={{fontSize:"10px",letterSpacing:"0.3em",textTransform:"uppercase",marginBottom:"12px",display:"block",opacity:0.9,color:"rgba(255,255,255,0.7)"}}>{sec.eyebrow}</span>}
          {sec.title&&<h2 style={{fontSize:"36px",fontWeight:"700",lineHeight:"1.1",margin:"0",color:"#fff",fontFamily:"Georgia,serif"}}>{sec.title}<br/>{sec.subtitle&&<em style={{fontStyle:"italic",display:"block"}}>{sec.subtitle}</em>}</h2>}
          <div style={{width:"40px",height:"2px",background:"#b11116",marginTop:"18px"}}/>
        </div>
        <div style={{borderTop:"1px solid rgba(255,255,255,0.2)"}}>
          {sec.items.filter(f=>f.q).map((faq,i)=><div key={i} style={{borderBottom:"1px solid rgba(255,255,255,0.15)",background:openFaq===i?"rgba(33,43,90,0.6)":"rgba(0,0,0,0.2)",backdropFilter:"blur(8px)",borderLeft:openFaq===i?"3px solid #b11116":"3px solid transparent",transition:"all 0.3s"}}>
            <button onClick={()=>setOpenFaq(openFaq===i?null:i)} style={{width:"100%",padding:"20px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"none",border:"none",cursor:"pointer",textAlign:"left",color:"#fff",gap:"12px"}}>
              <span style={{fontSize:"15px",fontWeight:"600",lineHeight:"1.4",flex:1}}>{faq.q}</span>
              <div style={{width:"30px",height:"30px",border:"1px solid rgba(255,255,255,0.4)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.4s",background:openFaq===i?"#b11116":"transparent",borderColor:openFaq===i?"#b11116":"rgba(255,255,255,0.4)",transform:openFaq===i?"rotate(-180deg)":"rotate(0)"}}>
                <span style={{fontSize:"13px"}}>↓</span>
              </div>
            </button>
            {openFaq===i&&<div style={{padding:"0 16px 20px",fontSize:"14px",lineHeight:"1.6",color:"#fff"}}>{faq.a}</div>}
          </div>)}
        </div>
      </div>
    </div>;
  }

  if(sec.type==="boxcards")return<div style={{padding:"40px 24px",fontFamily:"Arial,sans-serif"}}>
    {sec.eyebrow&&<p style={{color:RED,fontWeight:"700",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>{sec.eyebrow}</p>}
    {sec.title&&<h2 style={{fontSize:"26px",fontWeight:"700",color:"#0f172a",marginBottom:"8px"}}>{sec.title}</h2>}
    {sec.subtitle&&<p style={{color:"#64748b",marginBottom:"24px"}}>{sec.subtitle}</p>}
    {sec.cards.map((card,ci)=>{
      const ctxCSS=ctaStyleCSS(card.ctaStyle||"themed",primaryColor);
      const isHoriz=card.layout?.includes("Left")||card.layout?.includes("Right");
      const mediaFirst=card.layout?.startsWith("Media");
      const mediaEl=(card.images||[]).filter(Boolean).length>0?<img src={card.images[0]} style={{width:"100%",height:"180px",objectFit:"cover",borderRadius:"10px"}}/>:<div style={{height:"120px",background:"#f1f5f9",borderRadius:"10px",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8"}}>Image</div>;
      const textEl=<div style={{display:"flex",flexDirection:"column",justifyContent:"center",padding:isHoriz?"8px 0":"0"}}>
        {card.eyebrow&&<p style={{color:RED,fontWeight:"700",fontSize:"11px",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:"6px"}}>{card.eyebrow}</p>}
        {card.title&&<h3 style={{fontWeight:"700",color:"#0f172a",fontSize:"18px",marginBottom:"6px"}}>{card.title}</h3>}
        {card.subtitle&&<p style={{color:"#334155",fontSize:"14px",marginBottom:"8px"}}>{card.subtitle}</p>}
        {card.text&&<p style={{color:"#64748b",fontSize:"13px",lineHeight:"1.6",marginBottom:"12px"}}>{card.text}</p>}
        {card.ctaText&&<span style={{...ctxCSS,display:"inline-block",padding:"8px 20px",borderRadius:"999px",fontWeight:"700",fontSize:"13px",cursor:"pointer"}}>{card.ctaText}</span>}
      </div>;
      return<div key={ci} style={{border:"1px solid #e5e7eb",borderRadius:"12px",overflow:"hidden",marginBottom:"20px",display:isHoriz?"grid":"block",gridTemplateColumns:isHoriz?"1fr 1fr":"1fr"}}>
        {card.layout==="Text Only"?textEl:isHoriz?(mediaFirst?<>{mediaEl}{textEl}</>:<><div style={{padding:"20px"}}>{textEl}</div>{mediaEl}</>):<><div>{mediaEl}</div><div style={{padding:"20px"}}>{textEl}</div></>}
      </div>;
    })}
  </div>;

  return null;
}

// ── LANDING PAGE WAVE (v3 FULL REBUILD) ───────────────────────────────────────
function MLandingWave({waveLabel,campaignId,taskKey,task,setTask,pickups,onPickUp,onStatusChange,mondayItem,collabs,setCollabs,chat,setChat,sessions=[],onLinkChange,country="Malaysia"}){

    eyebrowText:"AIBP EXCLUSIVE",heroTitle:"Driving Value",heroSubtitle:"Through Trusted AI",
    heroLogo:"",topRightImage:"",
    date:"",time:"",
    numCTAs:1,ctaLabels:["Register Now"],ctaLinks:[""],ctaTypes:["zoho"],ctaStyles:["ghost"],
    endorsedLogos:[{label:"Endorsed By",logos:[""]}],partnerLogos:[{label:"Supporting Partners",logos:[""]}],
    countdown:false,countdownDate:"",
    heroStatMode:"countdown",heroStats:[{value:"",label:"",subtext:""}],
    zohoUrl:"",
  });
  const set=(k,v)=>{sD(p=>({...p,[k]:v}));if(k==="finalLink"&&onLinkChange)onLinkChange(v);};
  useEffect(()=>{if(onLinkChange&&d.finalLink)onLinkChange(d.finalLink);},[]);

  const[navLinks,sNav]=useState([
    {label:"About",href:"#about",isCta:false,ctaStyle:"outline"},
    {label:"Agenda",href:"#agenda",isCta:false,ctaStyle:"outline"},
    {label:"Speakers",href:"#speakers",isCta:false,ctaStyle:"outline"},
    {label:"Register Free",href:"#",isCta:true,ctaStyle:"solid"},
  ]);

  function addSection(type,afterId){
    const ns=mkSection(type);
    setSections(p=>{
      if(!afterId)return[...p,ns];
      const i=p.findIndex(s=>s.id===afterId);
      if(i<0)return[...p,ns];
      const n=[...p];n.splice(i+1,0,ns);return n;
    });
  }
  function removeSection(id){setSections(p=>p.filter(s=>s.id!==id));}
  function moveSection(id,dir){setSections(p=>{const i=p.findIndex(s=>s.id===id);if(i<0)return p;const n=[...p];const t=i+dir;if(t<0||t>=n.length)return p;[n[i],n[t]]=[n[t],n[i]];return n;});}
  function updateSection(id,updated){setSections(p=>p.map(s=>s.id===id?updated:s));}

  const heroWordCount=(d.heroTitle||"").trim().split(/\s+/).filter(Boolean).length;
  const heroOver=heroWordCount>5;

  // Build full page HTML for download
  function buildPageHTML(){
    const navHTML=navLinks.map(l=>l.isCta?`<button class="aibp-nav__btn aibp-nav__btn--solid" onclick="openZohoModal('${d.zohoUrl}')">${l.label}</button>`:`<li><a href="${l.href}">${l.label}</a></li>`).join("");
    const sectionsHTML=sections.filter(s=>s.visible!==false).map(s=>{
      const anchorAttr=s.anchor?`id="${s.anchor}"`:"";
      return`<section ${anchorAttr} data-section="${s.type}">[${SECTION_LABELS[s.type]||s.type} — edit in portal]</section>`;
    }).join("\n");
    return`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${d.seoTitle}</title><meta name="description" content="${d.metaDescription}"></head><body>${sectionsHTML}</body></html>`;
  }
  function buildSectionHTML(sec){
    return`<!-- ${SECTION_LABELS[sec.type]||sec.type} Section -->\n<section id="${sec.anchor||sec.type}">\n  <!-- Preview in portal for visual output -->\n  [${SECTION_LABELS[sec.type]||sec.type}]\n</section>`;
  }

  const gradientColor=d.heroBannerGradient==="theme"?theme.primary:d.heroBannerGradient==="black"?"#000000":theme.primary;

  return<div className="space-y-4">

    {/* Country Theme + Zoho hint */}

function CountdownBar({targetDate}){
  const[diff,setDiff]=useState({d:0,h:0,m:0,s:0});
  useEffect(()=>{
    function calc(){const now=new Date();const t=new Date(targetDate);const rem=t-now;if(rem<=0){setDiff({d:0,h:0,m:0,s:0});return;}const d=Math.floor(rem/86400000);const h=Math.floor((rem%86400000)/3600000);const m=Math.floor((rem%3600000)/60000);const s=Math.floor((rem%60000)/1000);setDiff({d,h,m,s});}
    calc();const i=setInterval(calc,1000);return()=>clearInterval(i);
  },[targetDate]);
  return<div style={{display:"flex",gap:"16px",marginTop:"20px",flexWrap:"wrap"}}>
    {[["d","Days"],["h","Hours"],["m","Minutes"],["s","Seconds"]].map(([k,l])=><div key={k} style={{textAlign:"center",minWidth:"60px"}}>
      <p style={{fontSize:"32px",fontWeight:"900",color:"white",lineHeight:"1"}}>{String(diff[k]).padStart(2,"0")}</p>
      <p style={{fontSize:"11px",color:"rgba(255,255,255,0.6)",textTransform:"uppercase",letterSpacing:"1px"}}>{l}</p>
    </div>)}
  </div>;
}

const LF=["Name","Job Title","Company","Contact","Session","Lead Source","Event","Country","Added","Referrer","Task Owner","UTM"];
function MLeadsTable({sessions=[],campaignTitle=""}){
  const[leads,sLeads]=useState([]);const[adding,sAdding]=useState(false);const ref=useRef();
  const empty=LF.reduce((a,f)=>({...a,[f]:""}),{});const[form,sForm]=useState({...empty});
  function addLead(){sLeads(p=>[...p,{...form,Added:new Date().toLocaleString(),id:Date.now()}]);sForm({...empty});sAdding(false);}
  function dl(){dlCSV([LF,...leads.map(l=>LF.map(f=>l[f]||""))],`${campaignTitle}-leads.csv`);}
  async function upload(e){const f=e.target.files[0];if(!f)return;const t=await f.text();const lines=t.split("\n").filter(Boolean);const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());const nl=lines.slice(1).map((line,i)=>{const vals=line.split(",").map(v=>v.replace(/^"|"$/g,"").trim());const obj={id:Date.now()+i};headers.forEach((h,j)=>{obj[h]=vals[j]||"";});return obj;});sLeads(p=>[...p,...nl]);}
  return<MCard className="p-5">
    <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
      <ST title="Leads Collected" subtitle={`${leads.length} lead${leads.length!==1?"s":""}`}/>

        <input ref={ref} type="file" accept=".csv" onChange={upload} style={{display:"none"}}/>
        <MBtn onClick={()=>ref.current.click()} className="bg-[#F4F3EE] text-[#3C3838] hover:bg-[#E8E5DC] text-xs">⬆ Upload CSV</MBtn>
        <MBtn onClick={dl} className="bg-[#F4F3EE] text-[#3C3838] hover:bg-[#E8E5DC] text-xs">⬇ Download CSV</MBtn>
        <MBtn onClick={()=>sAdding(true)} className="bg-[#B42024] hover:bg-[#3A1810] text-[#1F1B1B] text-xs">+ Add Lead</MBtn>
      </div>
    </div>
    {adding&&<div className="bg-white border border-[#E8E5DC] rounded-xl p-4 mb-4 space-y-3 fade">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {["Name","Job Title","Company","Contact","Referrer","Task Owner","Event","Country","UTM"].map(f=><MInp key={f} label={f} value={form[f]} onChange={e=>sForm(p=>({...p,[f]:e.target.value}))}/>)}

        <Sel label="Lead Source" value={form["Lead Source"]} onChange={e=>sForm(p=>({...p,"Lead Source":e.target.value}))}><option value="">— Select —</option>{["Email","LinkedIn","Website","Partner","Event","Other"].map(s=><option key={s}>{s}</option>)}</Sel>
      </div>
      <div className="flex gap-2"><MBtn onClick={()=>sAdding(false)} className="bg-[#F4F3EE] text-[#3C3838] flex-1">Cancel</MBtn><MBtn onClick={addLead} className="bg-emerald-600 hover:bg-emerald-500 text-[#1F1B1B] flex-1">Add Lead</MBtn></div>
    </div>}
    <div className="overflow-auto sh rounded-xl border border-[#E8E5DC]">
      <table className="w-full text-xs min-w-max">
        <thead><tr className="border-b border-[#E8E5DC] bg-white">{LF.map(f=><th key={f} className="px-3 py-2.5 text-left text-[#8B8680] font-medium whitespace-nowrap">{f}</th>)}<th className="px-3 py-2.5 text-[#8B8680] font-medium">–</th></tr></thead>

          {leads.length===0&&<tr><td colSpan={LF.length+1} className="px-3 py-8 text-center text-[#A8A583]">No leads yet.</td></tr>}
          {leads.map((l,i)=><tr key={l.id} className="border-b border-[#E8E5DC]/50 hover:bg-[#F4F3EE]/20">{LF.map(f=><td key={f} className="px-3 py-2 text-[#3C3838] whitespace-nowrap">{l[f]||"—"}</td>)}<td className="px-3 py-2"><button onClick={()=>sLeads(p=>p.filter((_,j)=>j!==i))} className="text-rose-400 text-xs">✕</button></td></tr>)}

function MSEOTool({content="",title="",metaDesc=""}){
  const[keywords,sKW]=useState("");const[showTool,sShow]=useState(false);
  const kwList=useMemo(()=>keywords.split(/[,\n]+/).map(k=>k.trim().toLowerCase()).filter(Boolean),[keywords]);
  const analysis=useMemo(()=>{const fullText=[title,metaDesc,content].join(" ").toLowerCase();const wordCount=fullText.split(/\s+/).filter(Boolean).length;return kwList.map(kw=>{const re=new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");const matches=(fullText.match(re)||[]).length;const density=wordCount>0?parseFloat(((matches/wordCount)*100).toFixed(2)):0;const inTitle=new RegExp(kw,"i").test(title);const inMeta=new RegExp(kw,"i").test(metaDesc);return{kw,count:matches,density,inTitle,inMeta};});},[kwList,content,title,metaDesc]);
  if(!showTool)return<MBtn onClick={()=>sShow(true)} className="w-full bg-[#F4F3EE] text-[#3C3838] hover:bg-[#E8E5DC] text-xs">🔍 Open SEO / AEO / GEO Analysis Tool</MBtn>;

al}</td></tr>;})}</tbody></table></div>}</div></div>;
}

function toWeekly(daily){if(!daily||daily.length===0)return[];const weeks={};daily.forEach(row=>{const s=String(row.date||"");if(s.length!==8)return;const dt=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));const day=dt.getDay();const diff=dt.getDate()-(day===0?6:day-1);const mon=new Date(dt);mon.setDate(diff);const key=mon.toISOString().slice(0,10);if(!weeks[key])weeks[key]={weekStart:key,sessions:0,users:0,views:0};weeks[key].sessions+=Number(row.sessions)||0;weeks[key].users+=Number(row.users)||0;weeks[key].views+=Number(row.views)||0;});return Object.values(weeks).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));}

// ── Levenshtein similarity (0–1) ───────────────────────────────────────────────
function tlSimilarity(a,b){
  if(!a||!b) return 0;
  a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
  if(a===b) return 1;
  const la=a.length, lb=b.length;
  if(la===0||lb===0) return 0;
  const dp=Array.from({length:la+1},(_,i)=>Array.from({length:lb+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=la;i++) for(let j=1;j<=lb;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return 1-dp[la][lb]/Math.max(la,lb);
}

const normEM=e=>(e||"").toLowerCase().trim();

function tlParseSeniority(title){
  const t=(title||"").toLowerCase();
  if(/\b(ceo|cto|cio|ciso|cdo|coo|cfo|chief|president|chairman)\b/.test(t)) return "C-Level";
  if(/\b(svp|senior vice president|evp|executive vp)\b/.test(t)) return "SVP/EVP";
  if(/\b(vp|vice president)\b/.test(t)) return "VP";
  if(/\b(director|head of|head,)\b/.test(t)) return "Director/Head";
  if(/\b(manager|lead|principal)\b/.test(t)) return "Manager/Lead";
  if(/\b(avp|deputy|associate)\b/.test(t)) return "AVP/Deputy";
  return "Specialist";
}

function tlSeniorityScore(title){
  const m={"C-Level":10,"SVP/EVP":9,"VP":8,"Director/Head":7,"Manager/Lead":5,"AVP/Deputy":4,"Specialist":2};
  return m[tlParseSeniority(title)]||2;
}

function tlCatScore(cat){ return {A:10,B:8,C:5,D:3,New:2,"No Activity":1}[cat]||1; }

function tlPriority(row){
  return Math.min(100,(row.icpMatch?20:0)+(row.bpMatch?20:0)+tlCatScore(row.cat)*3+tlSeniorityScore(row.title)*3);
}

function tlMatchICP(company,accounts){
  const c=(company||"").toLowerCase();
  return accounts.some(a=>{ const al=a.toLowerCase(); return c.includes(al)||al.includes(c)||tlSimilarity(c,al)>=0.82; });
}

function tlMatchBP(title,bpTitles){
  const t=(title||"").toLowerCase();
  return bpTitles.some(bp=>{ const bl=bp.toLowerCase(); return t.includes(bl)||bl.includes(t)||tlSimilarity(t,bl)>=0.85; });
}

function tlParseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  function splitRow(line){
    const cells=[]; let cur="",inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(ch===','&&!inQ){cells.push(cur.trim());cur="";}
      else cur+=ch;
    }
    cells.push(cur.trim()); return cells;
  }
  const headers=splitRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,""));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const vals=splitRow(lines[i]);
    const obj={}; headers.forEach((h,idx)=>{ obj[h]=vals[idx]||""; }); rows.push(obj);
  }
  return rows;
}

function tlMapContact(raw,source){
  function g(...keys){ for(const k of keys){ const v=raw[k]; if(v) return v; } return ""; }
  const firstName=g("first_name","firstname","first","fname","given_name");
  const lastName=g("last_name","lastname","last","lname","surname","family_name");
  const fullName=g("name","full_name","contact_name","contact");
  const email=g("email","email_address","e_mail","work_email");
  const title=g("title","job_title","position","designation","role");
  const company=g("company","account","account_name","organization","organisation","employer","company_name");
  const phone=g("phone","mobile","phone_number","mobile_number","contact_number");
  const country=g("country","mailing_country","billing_country","country_code");
  let fn=firstName,ln=lastName;
  if(!fn&&!ln&&fullName){ const parts=fullName.trim().split(/\s+/); fn=parts[0]||""; ln=parts.slice(1).join(" ")||""; }
  const zohoStage=g("lead_status","contact_stage","stage","status","lead_source");
  let cat="New";
  const stageL=(zohoStage||"").toLowerCase();
  if(stageL.includes("hot")||stageL.includes("qualified")||stageL.includes("meeting")) cat="A";
  else if(stageL.includes("warm")||stageL.includes("engaged")||stageL.includes("interested")) cat="B";
  else if(stageL.includes("cold")||stageL.includes("contact")||stageL.includes("open")) cat="C";
  else if(stageL.includes("inactive")||stageL.includes("no_activity")||stageL.includes("dormant")) cat="D";
  else if(source.startsWith("Zoho")) cat="No Activity";
  return {id:"tl_"+Math.random().toString(36).slice(2,8),firstName:fn,lastName:ln,email:normEM(email),title,company,phone,country,cat,source,manualOverride:false,status:"Pending",notes:""};
}

function tlDedup(incoming,existing,dedupLog){
  const result=[...existing];
  const log=[...dedupLog];
  const emailIdx={};
  result.forEach((r,i)=>{ if(r.email) emailIdx[normEM(r.email)]=i; });
  for(const row of incoming){
    const em=normEM(row.email);
    if(em&&emailIdx[em]!==undefined){
      const idx=emailIdx[em]; const kept=result[idx];
      const preferZoho=row.source.startsWith("Zoho")&&!kept.source.startsWith("Zoho");
      const winner=preferZoho?row:kept;
      result[idx]={...kept,...winner,id:kept.id,source:kept.source===row.source?kept.source:`${kept.source}+${row.source}`,mergedFrom:[...(kept.mergedFrom||[]),row.source+"("+row.email+")"]};
      log.push({ts:new Date().toISOString(),rule:"1-ExactEmail",nameKept:`${kept.firstName} ${kept.lastName}`,nameMerged:`${row.firstName} ${row.lastName}`,company:kept.company,score:"1.00",resolution:`${winner.source} wins`});
      continue;
    }
    const fn=`${row.firstName} ${row.lastName}`.toLowerCase().trim();
    const co=row.company.toLowerCase().trim();
    let matched=false;
    if(fn.length>3&&co.length>2){
      for(let i=0;i<result.length;i++){
        const r=result[i];
        const rfn=`${r.firstName} ${r.lastName}`.toLowerCase().trim();
        const rco=r.company.toLowerCase().trim();
        const ns=tlSimilarity(fn,rfn), cs=tlSimilarity(co,rco);
        if(ns>=0.85&&cs>=0.75){
          const score=((ns+cs)/2).toFixed(2);
          const preferZoho=row.source.startsWith("Zoho")&&!r.source.startsWith("Zoho");
          const winner=preferZoho?row:r;
          result[i]={...r,...winner,id:r.id,source:r.source===row.source?r.source:`${r.source}+${row.source}`,mergedFrom:[...(r.mergedFrom||[]),`${row.firstName} ${row.lastName}(${row.source},sim=${score})`]};
          if(!result[i].email&&row.email){ result[i].email=row.email; emailIdx[normEM(row.email)]=i; }
          log.push({ts:new Date().toISOString(),rule:"2-FuzzyNameCo",nameKept:`${r.firstName} ${r.lastName}`,nameMerged:`${row.firstName} ${row.lastName}`,company:r.company,score,resolution:`${winner.source} wins (n=${ns.toFixed(2)},c=${cs.toFixed(2)})`});
          matched=true; break;
        }
      }
    }
    if(!matched){ if(em) emailIdx[em]=result.length; result.push(row); }
  }
  return {result,log};
}

  const[showContract,sShowContract]=useState(false);
  const[rebuilding,sRebuilding]=useState(false);

  const[filterICP,sFilterICP]=useState("All");
  const[filterBP,sFilterBP]=useState("All");
  const[sortBy,sSortBy]=useState("priority");

  const[lastRebuild,sLastRebuild]=useState(null);
  const[uploadMsg,sUploadMsg]=useState("");

  useEffect(()=>{
    async function load(){
      try{
        const[cRes,dRes,sRes,lRes]=await Promise.all([
          window.storage.get(tlKey(sid,"contacts")).catch(()=>null),
          window.storage.get(tlKey(sid,"dedup")).catch(()=>null),
          window.storage.get(tlKey(sid,"sources")).catch(()=>null),
          window.storage.get(tlKey(sid,"lastRebuild")).catch(()=>null),

        else{ sContacts(THAI_SEED); await window.storage.set(tlKey(sid,"contacts"),JSON.stringify(THAI_SEED)).catch(()=>{}); }
        if(dRes) sDedupLog(JSON.parse(dRes.value));

      sLoading(false);
    }
    load();

    try{ await Promise.all([
      window.storage.set(tlKey(sid,"contacts"),JSON.stringify(c)).catch(()=>{}),
      window.storage.set(tlKey(sid,"dedup"),JSON.stringify(d)).catch(()=>{}),

    const file=e.target.files[0]; if(!file) return;

    if(!raw.length){ sUploadMsg("No rows found — check CSV headers."); return; }
    const mapped=raw.map(r=>tlMapContact(r,sourceLabel)).filter(r=>r.firstName||r.email);
    const enriched=mapped.map(r=>({...r,icpMatch:tlMatchICP(r.company,THAI_BFSI_CONTRACT.targetAccounts),bpMatch:tlMatchBP(r.title,THAI_BFSI_CONTRACT.bpTitles),seniority:tlParseSeniority(r.title)})).map(r=>({...r,priority:tlPriority(r)}));
    const{result,log}=tlDedup(enriched,contacts,dedupLog);
    const newSrc=[...sources,{name:file.name,rows:raw.length,merged:enriched.length-(result.length-contacts.length),uploadedAt:tstr(),type:sourceLabel}];
    sContacts(result); sDedupLog(log); sSources(newSrc);
    await persist(result,log,newSrc);

  async function rebuildFromSources(){
    if(!confirm("Rebuild will re-process the seed from scratch. Manual override rows are preserved. Continue?")) return;

    const overrides=contacts.reduce((m,c)=>c.manualOverride?{...m,[c.id]:c}:m,{});

// ── Config tab ────────────────────────────────────────────────────────────────
function ConfigTab({s,upd,onSyncResult}){
  const[localUrl,sLocalUrl]=useState(s.sheetUrl||"");
  const[syncing,sSyncing]=useState(false);
  const[lastSync,sLastSync]=useState(null);
  const t=s.targets||{};
  function setTarget(k,v){upd({targets:{...t,[k]:parseInt(v)||0}});}

  function saveUrl(){upd({sheetUrl:localUrl.trim()});}

  async function pushAll(){
    if(!s.sheetUrl){alert("Save a Sheet URL first.");return;}
    sSyncing(true);
    const r=await sheetPush(s.sheetUrl,"upsertSession",s);
    sSyncing(false);
    sLastSync({ok:r.ok,t:tstr(),op:"push"});
    onSyncResult&&onSyncResult(r);
  }
  async function pullAll(){
    if(!s.sheetUrl){alert("Save a Sheet URL first.");return;}
    sSyncing(true);
    const r=await sheetPull(s.sheetUrl,{action:"getSession",sessionId:s.id});
    sSyncing(false);
    sLastSync({ok:r.ok,t:tstr(),op:"pull"});
    if(r.ok&&r.data) upd(r.data);
    onSyncResult&&onSyncResult(r);
  }

  const{role:viewerRole}=useRole();
  const isPm=viewerRole==="PM";
  const[showAdvanced,sShowAdvanced]=useState(false);

  return <div className="space-y-4">
    <Card className={cx("p-5",!isPm&&"opacity-70")}>
      <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
        <div>
          <h3 className="text-base font-bold text-[#1F1B1B] serif">Per-session Google Sheet <span className="ml-2 text-[10px] uppercase tracking-widest text-[#B42024] font-bold align-middle">PM only · advanced</span></h3>
          <p className="text-xs text-[#8B8680] mt-0.5">{isPm?"Plumbing — pending Ruby's call between one master sheet (multiple tabs) vs per-session sheets. Hidden by default.":"Visible to PMs only."}</p>
        </div>
        {isPm&&<Btn variant="secondary" onClick={()=>sShowAdvanced(v=>!v)} className="text-xs">{showAdvanced?"Hide":"Show"} Sheet wiring</Btn>}
      </div>
      {isPm&&showAdvanced&&<div className="space-y-3">
        <ST title="Per-session Google Sheet" subtitle="One Sheet per networking session — paste its Apps Script Web App URL to enable sync"/>
        <div className="flex gap-2">
          <input value={localUrl} onChange={e=>sLocalUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="flex-1 bg-white border border-[#E8E5DC] rounded-xl px-3 py-2 text-sm mono focus:outline-none focus:border-[#B42024]"/>
          <Btn variant="primary" onClick={saveUrl}>Save URL</Btn>
        </div>
        {s.sheetUrl?<Pill tone="red">✓ URL saved</Pill>:<Pill tone="mute">No URL configured</Pill>}
        <div className="pt-3 border-t border-[#E8E5DC] flex flex-wrap items-center gap-3">
          <Btn variant="primary" onClick={pushAll} disabled={!s.sheetUrl||syncing}>{syncing?"Syncing…":"⬆ Push to Sheet"}</Btn>
          <Btn variant="gold" onClick={pullAll} disabled={!s.sheetUrl||syncing}>{syncing?"Syncing…":"⬇ Pull from Sheet"}</Btn>
          {lastSync&&<span className="text-xs text-[#8B8680]">Last {lastSync.op}: {lastSync.ok?"✓":"⚠"} {lastSync.t}</span>}
        </div>
        <div className="bg-[#A8A583]/15 border border-[#A8A583]/40 rounded-xl p-3 text-xs text-[#3C3838]">
          <strong>How it works:</strong> Each networking session links to its own Google Sheet via an Apps Script Web App. Push writes the entire session payload as JSON; Pull reads it back. The Apps Script must accept POST (action + payload) and GET (action + sessionId).
        </div>
      </div>}
    </Card>

    <Card className="p-5">
      <ST title="Category targets" subtitle="Used by dashboard registration metrics"/>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Inp label="Cat A" type="number" value={t.catA||""} onChange={v=>setTarget("catA",v)}/>
        <Inp label="Cat B" type="number" value={t.catB||""} onChange={v=>setTarget("catB",v)}/>
        <Inp label="Cat C" type="number" value={t.catC||""} onChange={v=>setTarget("catC",v)}/>
        <Inp label="Cat D" type="number" value={t.catD||""} onChange={v=>setTarget("catD",v)}/>
        <Inp label="Nett new" type="number" value={t.nettNew||""} onChange={v=>setTarget("nettNew",v)}/>
        <Inp label="Total regs" type="number" value={t.total||""} onChange={v=>setTarget("total",v)}/>
        <Inp label="Meetings" type="number" value={t.meetings||""} onChange={v=>setTarget("meetings",v)}/>
      </div>
    </Card>

    <Card className="p-5">
      <ST title="Session settings"/>
      <div className="grid md:grid-cols-2 gap-3">
        <Sel label="Status" value={s.status||"Active"} onChange={v=>upd({status:v})}>
          {["Active","Paused","Validation","Done"].map(x=><option key={x}>{x}</option>)}
        </Sel>
        <Inp label="Session ID" value={s.id||""} onChange={()=>{}} hint="Read-only"/>
      </div>
    </Card>
  </div>;
}

// ── Workspace shell ───────────────────────────────────────────────────────────
// ── SECTION STATUS BAR ──────────────────────────────────────────────────────
// Pinned to the top of EE Timeline / Outreach / Run of Show tabs.
// PM can flip status freely. Executor can only set Pause/Validation/Done if working
// on their own tasks (we trust the role for now; finer per-task ownership lands in
// the executor portal). Pause + Validation require a comment. Cancel is PM-only.
// Status changes write to s.sectionStatus[key] and s.sectionStatusComments[key].
function SectionStatusBar({s,sectionKey,sectionLabel,upd}){
  const{role}=useRole();
  const isPm=role==="PM";
  const cur=s.sectionStatus?.[sectionKey]||"Active";
  const meta=s.sectionStatusComments?.[sectionKey]||null;

  const[promptFor,sPromptFor]=useState(null); // status awaiting comment
  const[draft,sDraft]=useState("");

  function tryFlip(next){
    if(next===cur) return;
    if(next==="Cancelled"&&!isPm) return;
    if(next==="Paused"||next==="Validation"||next==="Cancelled"){
      // Require justification comment
      sDraft(meta?.comment||"");
      sPromptFor(next);
      return;
    }
    commit(next,"");
  }
  function commit(next,comment){
    const sectionStatus={...(s.sectionStatus||{}),[sectionKey]:next};
    const sectionStatusComments={...(s.sectionStatusComments||{})};
    if(comment){
      sectionStatusComments[sectionKey]={status:next,comment,by:role,at:new Date().toISOString()};
    }else{
      delete sectionStatusComments[sectionKey];
    }
    upd({sectionStatus,sectionStatusComments});
    sPromptFor(null);sDraft("");
  }

  const opts=isPm?[...SECTION_STATUSES,"Cancelled"]:SECTION_STATUSES;
  const tone={Active:"#B42024",Paused:"#E0A437",Validation:"#A8A583",Done:"#10B981",Cancelled:"#3C3838"};

  return <div className="mb-5">
    <div className="flex items-center justify-between flex-wrap gap-3 bg-[#FAFAF7] border border-[#E8E5DC] rounded-xl px-4 py-3">
      <div className="flex items-center gap-3 flex-wrap">
        <span className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">{sectionLabel} status</span>
        <div className="flex gap-1">
          {opts.map(opt=><button key={opt} onClick={()=>tryFlip(opt)} className={cx("px-3 py-1.5 rounded-lg text-xs font-bold border transition-all",cur===opt?"text-white":"bg-white text-[#3C3838] border-[#E8E5DC] hover:border-[#A8A583]")} style={cur===opt?{background:tone[opt],borderColor:tone[opt]}:{}}>{opt}</button>)}
        </div>
        {!isPm&&<span className="text-[10px] text-[#8B8680] italic ml-2">Executor: only update on your own tasks</span>}
      </div>
      {meta&&<div className="text-xs text-[#3C3838] max-w-md text-right">
        <span className="text-[10px] uppercase tracking-widest text-[#8B8680] font-bold mr-1">Note</span>
        <span className="italic">"{meta.comment}"</span>
        <span className="text-[10px] text-[#8B8680] ml-1">— {meta.by}</span>
      </div>}
    </div>

    {promptFor&&<div className="mt-2 bg-[#FFFBF0] border border-[#A8A583]/50 rounded-xl p-3">
      <p className="text-xs font-bold text-[#3C3838] mb-2">Justify "{promptFor}" — required</p>
      <textarea value={draft} onChange={e=>sDraft(e.target.value)} rows={2} placeholder={promptFor==="Paused"?"What's blocking it? Who do you need a response from?":promptFor==="Validation"?"Who's reviewing? What are you waiting on?":"Why is this being cancelled?"} className="w-full bg-white border border-[#E8E5DC] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#B42024]"/>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={()=>{sPromptFor(null);sDraft("");}}>Cancel</Btn>
        <Btn variant="primary" onClick={()=>{if(draft.trim())commit(promptFor,draft.trim());}} className={!draft.trim()?"opacity-60 cursor-not-allowed":""}>Save & flip to {promptFor}</Btn>
      </div>
    </div>}
  </div>;
}

function SessionWorkspace({session:initial,onBack,onUpdate}){
  const[s,sS]=useState(initial);
  const[tab,sTab]=useState("brief");
  const[savedAt,sSavedAt]=useState(null);

  // Persist any local edit upstream (keeps the dashboard list in sync)
  function upd(patch){
    const next={...s,...patch,updatedAt:new Date().toISOString()};
    sS(next);
    onUpdate&&onUpdate(next);
    sSavedAt(tstr());
  }

  const isAICY=s.id==="NS-20260408-AICY";
  const tabs=[
    {id:"brief",label:"Brief",icon:"📋"},
    {id:"timeline",label:"EE Timeline",icon:"📅"},
    {id:"outreach",label:"Outreach",icon:"👥"},
    ...(isAICY?[{id:"targetlist",label:"Target List",icon:"🎯"}]:[]),
    {id:"runofshow",label:"Run of Show",icon:"🎬"},
    {id:"marketing",label:"Marketing",icon:"📣"},
    {id:"config",label:"Config",icon:"⚙️"}
  ];

  return <div className="min-h-screen bg-white">
    <header className="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-[#E8E5DC]">
      <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3 min-w-0">
          <button onClick={onBack} className="text-[#8B8680] hover:text-[#B42024] transition-colors text-sm font-semibold">← Dashboard</button>
          <span className="text-[#E8E5DC]">|</span>
          <Brand size="sm"/>
          <span className="text-[#E8E5DC]">|</span>
          <div className="min-w-0">
            <p className="font-bold serif text-[#1F1B1B] text-base truncate">{s.theme||"Untitled session"}</p>
            <p className="text-xs text-[#8B8680] mono">{s.id} · {fDate(s.date)} · {s.country}</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <SBadge status={s.status} small/>
          {savedAt&&<span className="text-xs text-[#8B8680]">Saved {savedAt}</span>}
          {s.sheetUrl?<Pill tone="red">Sheet linked</Pill>:<Pill tone="mute">No Sheet</Pill>}
        </div>
      </div>
      <div className="max-w-7xl mx-auto px-6">
        <Tabs tabs={tabs} active={tab} onChange={sTab}/>
      </div>
    </header>

    <main className="max-w-7xl mx-auto px-6 py-6 fade">
      {/* Overdue justification banner — non-blocking, notifies PM */}
      {(()=>{
        const overdue=findOverdueNeedingJustification(s);
        if(!overdue.length) return null;
        return <div className="mb-5 bg-rose-50 border border-rose-300 rounded-2xl p-4">
          <div className="flex items-start gap-3 mb-3">
            <span className="text-rose-700 text-xl leading-none mt-0.5">●</span>
            <div className="flex-1">
              <p className="text-sm font-bold text-rose-800">{overdue.length} task{overdue.length!==1?"s":""} flipped to Overdue — justification required</p>
              <p className="text-xs text-rose-700 mt-0.5">PM has been notified. Add a comment below to explain the delay. Work continues — this banner is informational only.</p>
            </div>
          </div>
          <div className="space-y-2">
            {overdue.slice(0,5).map(t=><div key={t.source+t.id} className="bg-white border border-rose-200 rounded-xl px-3 py-2 flex items-center justify-between gap-3">
              <div className="min-w-0 flex-1">
                <p className="text-sm font-semibold text-[#1F1B1B] truncate">{t.name}</p>
                <p className="text-[10px] text-[#8B8680]">{t.source} · {t.owner} · was due {fDate(t.dueDate)}</p>
              </div>
              <button onClick={()=>{
                const note=prompt("Justification for "+t.name+" being overdue:");
                if(!note||!note.trim()) return;
                if(t.source==="EE Timeline"){
                  upd({eeTimeline:(s.eeTimeline||[]).map(x=>x.id===t.id?{...x,status:"Overdue",overdueComment:note.trim(),overdueAt:new Date().toISOString()}:x)});
                }else if(t.source==="Marketing"){
                  const next={...(s.marketing?.tasks||{})};
                  next[t.id]={...(next[t.id]||{}),status:"Overdue",overdueComment:note.trim(),overdueAt:new Date().toISOString()};
                  upd({marketing:{...(s.marketing||{}),tasks:next}});
                }else if(t.source==="Run of Show"){
                  upd({runOfShow:(s.runOfShow||[]).map(x=>x.id===t.id?{...x,status:"Overdue",overdueComment:note.trim(),overdueAt:new Date().toISOString()}:x)});
                }
              }} className="text-xs font-bold text-rose-700 hover:text-rose-900 px-3 py-1.5 rounded-lg border border-rose-300 hover:bg-rose-100">Add justification</button>
            </div>)}
            {overdue.length>5&&<p className="text-xs text-rose-700 italic">+ {overdue.length-5} more — open the relevant tabs to handle them.</p>}
          </div>
        </div>;
      })()}
      {tab==="brief"&&<BriefTab s={s} onUpdate={(next)=>{sS(next);onUpdate&&onUpdate(next);sSavedAt(tstr());}}/>}
      {tab==="timeline"&&<>
        <SectionStatusBar s={s} sectionKey="timeline" sectionLabel="EE Timeline" upd={upd}/>
        <EETimelineTab s={s} upd={upd}/>
      </>}
      {tab==="outreach"&&<>
        <SectionStatusBar s={s} sectionKey="outreach" sectionLabel="Outreach" upd={upd}/>
        <OutreachTab s={s} upd={upd}/>
      </>}
      {tab==="targetlist"&&<TargetListTab s={s}/>}
      {tab==="runofshow"&&<>
        <SectionStatusBar s={s} sectionKey="runofshow" sectionLabel="Run of Show" upd={upd}/>
        <RunOfShowTab s={s} upd={upd}/>
      </>}
      {tab==="marketing"&&<MarketingTab s={s} upd={upd}/>}
      {tab==="config"&&<ConfigTab s={s} upd={upd}/>}
    </main>
  </div>;
}

// ────────────────────────────────────────────────────────────────────────────────
// APP ROUTER
// ────────────────────────────────────────────────────────────────────────────────
function App(){
  // Persisted sessions (start from seed, persist to localStorage from Phase 5 onwards)
  const[sessions,sSessions]=useState(()=>{
    // BETA build: start every tester from a clean slate. Seed sessions disabled.
    try{
      const raw=localStorage.getItem(LS.sessions);
      if(raw){const p=JSON.parse(raw);if(Array.isArray(p))return p;}
    }catch{}
    return [];
  });
  const[view,sView]=useState("dashboard"); // dashboard | newProject | workspace
  const[activeSession,sActiveSession]=useState(null);

  // Role: PM (full master settings) vs Executor (view + execute own tasks only)
  const[role,sRole]=useState(()=>{
    try{return localStorage.getItem(LS.role)||"PM";}catch{return "PM";}
  });
  useEffect(()=>{
    try{localStorage.setItem(LS.role,role);}catch{}
    if(typeof window!=="undefined") window.__aibpRole=role;
  },[role]);

  useEffect(()=>{
    try{localStorage.setItem(LS.sessions,JSON.stringify(sessions));}catch{}
  },[sessions]);

  function openSession(s){sActiveSession(s);sView("workspace");}
  function backToDashboard(){sActiveSession(null);sView("dashboard");}

  function handleCreate(newSession){
    sSessions(p=>[newSession,...p]);
    sActiveSession(newSession);
    sView("workspace");
  }

  function handleUpdate(updated){
    sSessions(p=>p.map(x=>x.id===updated.id?updated:x));
    sActiveSession(updated);
  }

  function handleImport(parsed){
    // Normalise / fill defaults so imports from older or partial schemas don't break the workspace
    const merged={...newSessionShape(),...parsed};
    sSessions(p=>{
      const idx=p.findIndex(x=>x.id===merged.id);
      if(idx>=0){const c=[...p];c[idx]=merged;return c;}
      return [merged,...p];
    });
    sActiveSession(merged);
    sView("workspace");
  }

  // Role toggle + Beta reset button — fixed top-right
  const RoleToggle=()=>(
    <div className="fixed top-3 right-3 z-50 flex items-center gap-2">
      <div className="bg-white border border-[#E8E5DC] rounded-full shadow-sm flex items-center text-xs">
        <span className="px-3 py-1.5 text-[10px] uppercase tracking-widest text-[#8B8680] font-bold">View as</span>
        {["PM","Executor"].map(r=>(
          <button key={r} onClick={()=>sRole(r)} className={cx("px-3 py-1.5 rounded-full font-semibold transition-all",role===r?(r==="PM"?"bg-[#B42024] text-white":"bg-[#A8A583] text-white"):"text-[#3C3838] hover:bg-[#FAFAF7]")}>{r}</button>
        ))}
      </div>
      <button onClick={()=>{
        if(!confirm("Reset all data?\n\nThis wipes every project from your browser and starts you back at an empty dashboard. This cannot be undone.")) return;
        try{
          localStorage.removeItem(LS.sessions);
          localStorage.removeItem(LS.ui);
          localStorage.removeItem(LS.role);
        }catch{}
        location.reload();
      }} className="bg-white border border-[#E8E5DC] rounded-full shadow-sm px-3 py-1.5 text-xs font-semibold text-[#8B8680] hover:text-[#B42024] hover:border-[#B42024]" title="Wipe all data and reload">↻ Reset</button>
    </div>
  );

  let body;
  if(view==="newProject") body=<NewProject onBack={backToDashboard} onCreate={handleCreate}/>;
  else if(view==="workspace") body=<SessionWorkspace session={activeSession} onBack={backToDashboard} onUpdate={handleUpdate}/>;
  else body=<Dashboard sessions={sessions} onOpen={openSession} onNew={()=>sView("newProject")}/>;

  return <RoleContext.Provider value={{role,setRole:sRole}}>
    <RoleToggle/>
    {body}
  </RoleContext.Provider>;
}
